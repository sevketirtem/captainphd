{{ define "main" }}
<figure class="kapak">
  <img src="{{ "img/captainphd-kapak.jpg" | relURL }}" width="1200" height="630" alt="{{ cond (eq site.Language.Lang "nb") "Illustrasjon: et lasteskip i en norsk fjord ved blåtime, med fyr og lyssatt sjømerke" "Illustration: a cargo ship in a Norwegian fjord at blue hour, with a lighthouse and a lit sea mark" }}" fetchpriority="high">
  <figcaption>{{ cond (eq site.Language.Lang "nb") "Illustrasjon laget med KI (Google Nano Banana Pro). Ikke en kilde for lanterner eller sjømerker." "Illustration made with AI (Google Nano Banana Pro). Not a reference for lights or sea marks." }}</figcaption>
</figure>
<section class="hero">
  <p class="eyebrow">{{ site.Params.slogan }}</p>
  {{ .Content }}
</section>
<figure class="kapak video">
  <video autoplay muted loop playsinline preload="metadata" poster="{{ "video/bro-natt.jpg" | relURL }}" width="1280" height="720" aria-label="{{ cond (eq site.Language.Lang "nb") "Atmosfærevideo: utsikt fra en skipsbro om natten" "Atmosphere video: a view from a ship's bridge at night" }}">
    <source src="{{ "video/bro-natt.mp4" | relURL }}" type="video/mp4">
  </video>
  <figcaption>{{ cond (eq site.Language.Lang "nb") "Video laget med KI (Google Veo 3.1 Lite). Stemningsbilde; lysene er ikke en kilde for lanterner." "Video made with AI (Google Veo 3.1 Lite). Atmosphere only; the lights are not a reference for navigation lights." }}</figcaption>
</figure>
<script>if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){var v=document.querySelector(".kapak.video video");if(v){v.removeAttribute("autoplay");v.pause();v.controls=true}}</script>
{{- $seksjon := cond (eq site.Language.Lang "nb") "/spill" "/games" }}
{{- with site.GetPage $seksjon }}
<section>
  <h2>{{ .Title }}</h2>
  <div class="grid">
    {{- range .Pages.ByWeight }}{{ partial "spill-kort.html" . }}{{ end }}
  </div>
</section>
{{- end }}
<figure class="band">
  <img src="{{ "img/bandet-forside.webp" | relURL }}" width="1600" height="500" alt="{{ cond (eq site.Language.Lang "nb") "Utsikt fra baugen på et skip over et rolig hav i morgengry" "A view from a ship's bow over a calm sea at dawn" }}" loading="lazy" decoding="async">
  <figcaption>{{ i18n "kiBilde" }}</figcaption>
</figure>
{{ end }}
