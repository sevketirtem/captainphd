<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 5v22M5 16h22" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="var(--signal)"/></svg>
      <span>Captain PhD</span>
    </a>
    <nav aria-label="{{ i18n "spill" }}">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      {{- range .Translations }}
      <a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.LanguageCode }}" lang="{{ .Language.LanguageCode }}">{{ .Language.LanguageName }}</a>
      {{- else }}
      {{- range site.Home.Translations }}<a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.LanguageCode }}">{{ .Language.LanguageName }}</a>{{ end }}
      {{- end }}
    </nav>
  </div>
</header>
