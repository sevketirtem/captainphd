const N = 10;

/* ---------- Hjelpere ---------- */
const rad = d => d * Math.PI / 180;
const norm = a => ((a % 360) + 360) % 360;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function cycle(pool) { let q = []; return () => { if (!q.length) q = shuffle(pool.slice()); return q.pop(); }; }
const L2 = (nb, en) => ({ nb, en });
const f1 = x => x.toFixed(1);
const p3 = b => String(Math.round(norm(b))).padStart(3, '0') + '°';

/* ---------- Tegning (SVG) ---------- */
function hull(x, y, h, col, w) {
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(h)})"><path d="M0 -14 L6.5 -5 L6.5 11 L-6.5 11 L-6.5 -5 Z" fill="${col}" stroke="var(--fg)" stroke-width="${w || 1.4}" stroke-linejoin="round"/></g>`;
}
function badge(x, y, ch, col) {
  return `<circle cx="${f1(x)}" cy="${f1(y)}" r="10" fill="var(--surface)" stroke="${col || 'var(--fg)'}" stroke-width="2"/>` +
    `<text x="${f1(x)}" y="${f1(y + 4.5)}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)">${ch}</text>`;
}
function arrowHead(x, y, h, col) {
  return `<polygon transform="translate(${f1(x)} ${f1(y)}) rotate(${h})" points="0,-7 5,5 -5,5" fill="${col}"/>`;
}

/* Tre peilinger (kompasspeiling) til samme fartøy; eget fartøy kurs 000° */
function bearSVG(bs, tx) {
  const W = 340, H = 250, ox = 170, oy = 218, k = 24;
  const pts = bs.b.map((b, i) => ({ x: ox + bs.r[i] * k * Math.sin(rad(b)), y: oy - bs.r[i] * k * Math.cos(rad(b)) }));
  let g = '';
  pts.forEach(p => { g += `<line x1="${ox}" y1="${oy}" x2="${f1(p.x)}" y2="${f1(p.y)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4"/>`; });
  g += `<polyline points="${pts.map(p => f1(p.x) + ',' + f1(p.y)).join(' ')}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 4"/>`;
  const dx = pts[2].x - pts[1].x, dy = pts[2].y - pts[1].y, hd = norm(Math.atan2(dx, -dy) * 180 / Math.PI);
  pts.forEach((p, i) => {
    g += `<g opacity="${i === 2 ? 1 : 0.55}">${hull(p.x, p.y, hd, 'var(--amber)', 1.2)}</g>`;
    const left = bs.b[i] > 180, lx = p.x + (left ? -14 : 14), anc = left ? 'end' : 'start';
    g += `<text x="${f1(lx)}" y="${f1(p.y - 4)}" text-anchor="${anc}" font-size="12" font-weight="700" fill="var(--fg)">${p3(bs.b[i])}</text>` +
      `<text x="${f1(lx)}" y="${f1(p.y + 9)}" text-anchor="${anc}" font-size="11" fill="var(--muted)">${bs.t[i] === 0 ? '0' : '+' + bs.t[i]} ${tx.min}</text>`;
  });
  g += `<line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy - 62}" stroke="var(--sea)" stroke-width="1.6" stroke-dasharray="5 4"/>` + arrowHead(ox, oy - 62, 0, 'var(--sea)') +
    `<text x="${ox + 8}" y="${oy - 52}" font-size="11" fill="var(--sea)">000°</text>`;
  g += hull(ox, oy, 0, 'var(--sea)', 2) + `<text x="${ox + 12}" y="${oy + 14}" font-size="12" font-weight="700" fill="var(--fg)">${tx.you}</text>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx.bearAlt}">${g}</svg>`;
}

/* Trang lei, tre posisjoner (stiplet), eget fartøy nederst. pos: x-posisjoner for A,B,C i bokstavrekkefølge */
function chanSVG(sc, tx, solved) {
  const W = 340, H = 250, xl = 90, xr = 250;
  let g = `<rect x="0" y="0" width="${xl}" height="${H}" fill="var(--line)"/><rect x="${xr}" y="0" width="${W - xr}" height="${H}" fill="var(--line)"/>` +
    `<line x1="${xl}" y1="0" x2="${xl}" y2="${H}" stroke="var(--fg)" stroke-width="2"/><line x1="${xr}" y1="0" x2="${xr}" y2="${H}" stroke="var(--fg)" stroke-width="2"/>`;
  sc.slots.forEach(s => {
    const good = solved && s.letter === sc.ok;
    g += `<g opacity="${good ? 1 : 0.65}">${hull(s.x, 108, 0, good ? 'var(--ok)' : 'none', 1.8).replace('<path', '<path stroke-dasharray="' + (good ? '0' : '3 3') + '"')}</g>` + badge(s.x, 78, s.letter, good ? 'var(--ok)' : 'var(--fg)');
  });
  g += `<line x1="170" y1="215" x2="170" y2="170" stroke="var(--sea)" stroke-width="1.6" stroke-dasharray="5 4"/>` + arrowHead(170, 168, 0, 'var(--sea)');
  g += hull(170, 225, 0, 'var(--sea)', 2) + `<text x="184" y="240" font-size="12" font-weight="700" fill="var(--fg)">${tx.you}</text>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx.chanAlt}">${g}</svg>`;
}

/* TSS: to seilingsleier (vest: sørover, øst: nordover) og separasjonssone. kind: 'cross' | 'join'. */
const LANE = { wl: 112, wr: 158, zl: 158, zr: 182, el: 182, er: 228 };
function tssSVG(sc, tx, solved) {
  const W = 340, H = 280, L = LANE;
  let g = `<rect x="${L.wl}" y="0" width="${L.wr - L.wl}" height="${H}" fill="var(--water)" stroke="var(--line)"/>` +
    `<rect x="${L.zl}" y="0" width="${L.zr - L.zl}" height="${H}" fill="var(--line)" opacity=".8"/>` +
    `<rect x="${L.el}" y="0" width="${L.er - L.el}" height="${H}" fill="var(--water)" stroke="var(--line)"/>`;
  [60, 140, 220].forEach(y => {
    g += arrowHead((L.wl + L.wr) / 2, y, 180, 'var(--muted)') + arrowHead((L.el + L.er) / 2, y, 0, 'var(--muted)');
  });
  g += `<text x="${(L.zl + L.zr) / 2 + 3}" y="140" text-anchor="middle" font-size="9" fill="var(--muted)" transform="rotate(-90 ${(L.zl + L.zr) / 2 + 3} 140)">${tx.zone}</text>`;
  sc.tracks.forEach(t => {
    const good = solved && t.letter === sc.ok;
    const col = good ? 'var(--ok)' : 'var(--sea)';
    g += `<polyline points="${t.pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ')}" fill="none" stroke="${col}" stroke-width="${good ? 4 : 2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${solved && !good ? 0.45 : 1}"/>`;
  });
  sc.tracks.forEach(t => { g += badge(t.lab[0], t.lab[1], t.letter, solved && t.letter === sc.ok ? 'var(--ok)' : 'var(--fg)'); });
  g += hull(sc.start[0], sc.start[1], sc.hd, 'var(--sea)', 2) + `<text x="${sc.start[0] + (sc.kind === 'join' ? 0 : 12)}" y="${sc.start[1] + (sc.kind === 'join' ? 27 : -20)}" text-anchor="${sc.kind === 'join' ? 'middle' : 'start'}" font-size="12" font-weight="700" fill="var(--fg)">${tx.you}</text>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx.tssAlt}">${g}</svg>`;
}
function crossScene() {
  const start = [26, 250], X1 = 312, Y1 = 14, heads = [90, 62, 40], letters = shuffle(['A', 'B', 'C']);
  const tracks = heads.map((h, i) => {
    const dx = Math.sin(rad(h)), dy = -Math.cos(rad(h));
    const tx = dx > 0 ? (X1 - start[0]) / dx : Infinity, ty = dy < 0 ? (Y1 - start[1]) / dy : Infinity, t = Math.min(tx, ty);
    const end = [start[0] + dx * t, start[1] + dy * t];
    return { letter: letters[i], h, pts: [start, end], lab: [start[0] + dx * t * 0.9, start[1] + dy * t * 0.9 + (i === 0 ? -16 : 0)] };
  });
  return { kind: 'cross', start, hd: 90, tracks, ok: tracks[0].letter };
}
function joinScene() {
  const start = [310, 244], cx = (LANE.el + LANE.er) / 2, angs = [25, 50, 80], letters = shuffle(['A', 'B', 'C']);
  const tracks = angs.map((a, i) => {
    const jy = start[1] - (start[0] - cx) / Math.tan(rad(a));
    const mid = [(start[0] + cx) / 2, (start[1] + jy) / 2];
    return { letter: letters[i], a, pts: [start, [cx, jy], [cx, 12]], lab: [mid[0] + (i === 0 ? 14 : 12), mid[1] - 8] };
  });
  return { kind: 'join', start, hd: 315, tracks, ok: tracks[0].letter };
}

/* ---------- Scene-spørsmål ---------- */
const o = (id, nb, en) => ({ id, nb, en });
const LETTER = ['A', 'B', 'C'];
const letterOpts = () => LETTER.map(l => ({ id: l, nb: 'Rute ' + l, en: 'Route ' + l }));
const slotOpts = () => LETTER.map(l => ({ id: l, nb: 'Posisjon ' + l, en: 'Position ' + l }));

function bearQuestion(kind) {
  const side = pick([1, -1]), B = pick([35, 50, 65]), r = [6, 4.5, 3], t = [0, 3, 6];
  const bs = kind === 'const' ? { b: [norm(side * B), norm(side * B), norm(side * B)], r, t }
    : { b: [norm(side * B), norm(side * (B + 7)), norm(side * (B + 17))], r, t };
  bs.b = bs.b.map(Math.round);
  if (kind === 'const') return { kind: 'mc', scene: { bear: bs }, pool: 'bc' + side + B,
    stem: L2('Et maskindrevet fartøy nærmer seg deg. Du tok kompasspeiling til det tre ganger med tre minutters mellomrom (se tegningen), og avstanden minker. Hva sier regel 7 (d)(i)?',
             'A power-driven vessel is approaching you. You took a compass bearing of it three times at three-minute intervals (see the drawing) and the range is decreasing. What does rule 7 (d)(i) say?'),
    opts: shuffle([o('ok', 'Det skal regnes med at det er fare for sammenstøt', 'Risk of collision shall be deemed to exist'),
      o('a', 'Det er ikke fare for sammenstøt så lenge det andre fartøyet ennå er langt unna', 'There is no risk of collision as long as the other vessel is still far away'),
      o('b', 'Det er ikke fare for sammenstøt, for det er det andre fartøyet som skal vike', 'There is no risk of collision, because the other vessel is the one to give way'),
      o('c', 'Du må vente til fartøyene er på tvers av hverandre før du vurderer faren', 'You must wait until the vessels are abeam of each other before assessing the risk')]),
    ok: 'ok', ref: 'Regel 7 (d)(i), s. 78–79',
    x: L2('Det skal regnes med at det er fare for sammenstøt hvis kompasspeilingen av et fartøy som nærmer seg, ikke forandrer seg merkbart (regel 7 (d)(i)). Her er peilingen den samme hver gang. Hvem som skal vike, avgjøres først etterpå av de øvrige reglene.',
          'Such risk shall be deemed to exist if the compass bearing of an approaching vessel does not appreciably change (rule 7 (d)(i)). Here the bearing is the same every time. Who is to give way is decided afterwards by the other rules.') };
  return { kind: 'mc', scene: { bear: bs }, pool: 'bx' + side + B,
    stem: L2('Peilingen til et fartøy som nærmer seg, endrer seg tydelig (se tegningen). Betyr det at det ikke er fare for sammenstøt?',
             'The bearing of an approaching vessel is clearly changing (see the drawing). Does that mean there is no risk of collision?'),
    opts: shuffle([o('ok', 'Nei, ikke nødvendigvis: slik fare kan undertiden foreligge, spesielt ved et meget stort fartøy, et slep eller kort avstand', 'Not necessarily: such risk may sometimes exist, particularly when approaching a very large vessel or a tow, or at close range'),
      o('a', 'Ja, en merkbar peilingsendring utelukker alltid fare', 'Yes, an appreciable bearing change always rules out risk'),
      o('b', 'Ja, så lenge avstanden bare minker sakte', 'Yes, as long as the range only decreases slowly'),
      o('c', 'Peilingen har ingen betydning for vurderingen', 'The bearing has no bearing on the assessment')]),
    ok: 'ok', ref: 'Regel 7 (d)(ii), s. 78–79',
    x: L2('Slik fare kan undertiden foreligge selv om det er en merkbar forandring i peilingen, spesielt når man nærmer seg et meget stort fartøy eller et slep, eller et fartøy på kort avstand (regel 7 (d)(ii)). Og er du i tvil, skal du regne med at det er fare (regel 7 (a)).',
          'Such risk may sometimes exist even when an appreciable bearing change is evident, particularly when approaching a very large vessel or a tow or when approaching a vessel at close range (rule 7 (d)(ii)). And if in doubt, risk shall be deemed to exist (rule 7 (a)).') };
}

function chanQuestion() {
  const letters = shuffle(LETTER.slice()), xs = [118, 170, 222];
  const slots = xs.map((x, i) => ({ x, letter: letters[i] })), ok = letters[2];
  return { kind: 'mc', scene: { chan: { slots, ok }, sol: true }, pool: 'ch' + letters.join(''),
    stem: L2('Du følger en trang lei i pilens retning. Hvor i leia skal du holde deg, når det lar seg gjøre uten fare? (Stiplede fartøy A, B og C viser tre mulige posisjoner.)',
             'You are proceeding along a narrow channel in the direction of the arrow. Where in the channel shall you keep, when it is safe and practicable? (The dashed vessels A, B and C show three possible positions.)'),
    opts: slotOpts(), ok, ref: 'Regel 9 (a), s. 90',
    x: L2('Et fartøy som seiler i en trang lei, skal så nær som mulig holde seg til den av leias yttergrenser som det har på sin styrbord side, når det lar seg gjøre uten fare (regel 9 (a)). Se på tegningen: styrbord er til høyre i fartsretningen.',
          'A vessel proceeding along the course of a narrow channel shall keep as near to the outer limit of the channel which lies on her starboard side as is safe and practicable (rule 9 (a)). In the drawing, starboard is to the right in the direction of travel.') };
}
function tssCrossQuestion() {
  const sc = crossScene();
  return { kind: 'mc', scene: { tss: sc, sol: true }, pool: 'tc' + sc.tracks.map(t => t.letter).join(''),
    stem: L2('Du er nødt til å krysse seilingsleiene i et trafikkseparasjonssystem. Trafikken går som pilene viser. Hvilken rute følger regel 10 (c)?',
             'You are obliged to cross the traffic lanes of a traffic separation scheme. Traffic flows as the arrows show. Which route follows rule 10 (c)?'),
    opts: letterOpts(), ok: sc.ok, ref: 'Regel 10 (c), s. 104; Boka s. 109',
    x: L2('Et fartøy som er nødt til å krysse en seilingslei, skal krysse på en kurs så nær som praktisk mulig tvers på den generelle retningen for skipstrafikken (regel 10 (c)). Boka (s. 109) understreker at det er fartøyets kjøllinje, altså heading, som skal stå tvers, ikke kursen over grunnen. Det korter ned krysstiden og gjør det lettere for trafikken i leia å se hva du gjør.',
          'A vessel obliged to cross traffic lanes shall cross on a heading as nearly as practicable at right angles to the general direction of traffic flow (rule 10 (c)). The book (p. 109) stresses that it is the vessel’s heading, not her course over the ground, that shall be at right angles. This shortens the crossing time and makes it easier for the traffic in the lane to see what you are doing.'),};
}
function tssJoinQuestion() {
  const sc = joinScene();
  return { kind: 'mc', scene: { tss: sc, sol: true }, pool: 'tj' + sc.tracks.map(t => t.letter).join(''),
    stem: L2('Du skal gå inn i den østre seilingsleia fra siden, ikke fra leias begynnelse. Hvilken rute følger regel 10 (b)(iii)?',
             'You are going to join the eastern traffic lane from the side, not from the start of the lane. Which route follows rule 10 (b)(iii)?'),
    opts: letterOpts(), ok: sc.ok, ref: 'Regel 10 (b)(iii), s. 104',
    x: L2('Et fartøy skal normalt gå inn i eller ut av en seilingslei der den begynner eller slutter. Når det går inn i eller ut av en lei fra siden, skal det gjøre dette med så liten vinkel på den generelle retningen for seilasen som er praktisk mulig (regel 10 (b)(iii)).',
          'A vessel shall normally join or leave a traffic lane at the termination of the lane. When joining or leaving from either side, she shall do so at as small an angle to the general direction of traffic flow as practicable (rule 10 (b)(iii)).'),};
}

/* ---------- Regnestykker (Boka) ---------- */
const TCPA_SETS = [[6, 12], [6, 24], [9, 18], [3, 12], [8, 16], [12, 24], [4, 8], [5, 20], [9, 36], [6, 18], [6, 36], [12, 48]];
function tcpaQuestion() {
  const [d, v] = pick(TCPA_SETS), t = Math.round(d / v * 60);
  const vals = [t, t * 2, Math.max(1, Math.round(t / 2)), t + 10].filter((x, i, a) => a.indexOf(x) === i);
  while (vals.length < 4) vals.push(vals[vals.length - 1] + 7);
  return { kind: 'mc', pool: 'tcpa' + d + '-' + v,
    stem: L2(`Et fartøy ligger på konstant kompasspeiling og nærmer seg deg. Avstanden er ${d} nm, og den relative farten er ${v} kn. Hvor mange minutter er det til det er i nærmeste passeringspunkt (TCPA)?`,
             `A vessel is on a constant compass bearing and approaching you. The range is ${d} nm and the relative speed is ${v} kn. How many minutes is it to the closest point of approach (TCPA)?`),
    opts: shuffle(vals.map(x => o('v' + x, x + ' min', x + ' min'))), ok: 'v' + t,
    x: L2(`TCPA = avstand ÷ relativ fart × 60 = ${d} ÷ ${v} × 60 = ${t} minutter.`, `TCPA = range ÷ relative speed × 60 = ${d} ÷ ${v} × 60 = ${t} minutes.`),
    ref: 'Boka s. 19, s. 85 (regnestykke, ikke regeltekst)' };
}
function stopQuestion() {
  const len = pick([250, 300, 350]), nm = len * 15 / 1852, c = f1(nm);
  const vals = [c, f1(nm / 2), f1(nm * 2), f1(nm * 3)];
  return { kind: 'mc', pool: 'stop' + len,
    stem: L2(`Et tankskip er ${len} m langt. Ifølge IMOs manøvreringsstandarder skal stoppelengden normalt ikke være mer enn 15 skipslengder. Omtrent hvor mange nautiske mil er det? (1 nm = 1852 m)`,
             `A tanker is ${len} m long. According to IMO’s manoeuvrability standards the stopping distance shall normally not exceed 15 ship lengths. About how many nautical miles is that? (1 nm = 1852 m)`),
    opts: shuffle(vals.map(x => o('v' + x, x + ' nm', x + ' nm'))), ok: 'v' + c,
    x: L2(`${len} m × 15 = ${len * 15} m ≈ ${c} nm. Boka (s. 72) nevner at noen skip med høyt deplasement kan få lov til opptil 20 skipslengder. Det viser hvorfor sikker fart (regel 6) ikke kan avgjøres med et fast tall.`,
          `${len} m × 15 = ${len * 15} m ≈ ${c} nm. The book (p. 72) mentions that some ships with large displacement may be allowed up to 20 ship lengths. That shows why safe speed (rule 6) cannot be decided by a fixed number.`),
    ref: 'Boka s. 72 (IMO-standard, ikke regeltekst)' };
}

const mk = (stem, os, x, ref, g) => ({ g, q: stem, o: os, x, ref });
/* Faktaspørsmål. o[0] er riktig svar. g: 'u' (regel 5, 6), 'f' (regel 7), 't' (regel 9), 's' (regel 10). */
const FACTS = [
  /* ---- Regel 5 og 6 ---- */
  mk(L2('Hva er hensikten med utkikken etter regel 5?', 'What is the purpose of the look-out required by rule 5?'),
    [L2('Å få en full vurdering av situasjonen og av faren for sammenstøt', 'To make a full appraisal of the situation and of the risk of collision'), L2('Å finne den raskeste ruten', 'To find the fastest route'), L2('Å føre navn på alle fartøy som passerer', 'To record the names of all passing vessels'), L2('Å rapportere trafikken til sjøtrafikksentralen', 'To report the traffic to the vessel traffic service')],
    L2('Ethvert fartøy skal alltid holde forsvarlig utkikk, slik at det foreligger en full vurdering av situasjonen og av faren for sammenstøt (regel 5).', 'Every vessel shall at all times maintain a proper look-out so as to make a full appraisal of the situation and of the risk of collision (rule 5).'), 'Regel 5, s. 41', 'u'),

    L2('Utkikken skal holdes ved syn og hørsel, og ved alle tilgjengelige midler som er brukbare under de rådende omstendigheter og forhold (regel 5).', 'The look-out shall be kept by sight and hearing as well as by all available means appropriate in the prevailing circumstances and conditions (rule 5).'), 'Regel 5, s. 41', 'u'),

    L2('Regel 5 sier «ethvert fartøy». Boka (s. 41–42) understreker at utkikk også gjelder fartøy som ikke er underveis.', 'Rule 5 says “every vessel”. The book (pp. 41–42) stresses that look-out also applies to vessels that are not underway.'), 'Regel 5, s. 41 (Boka s. 41–42)', 'u'),
  mk(L2('Hva skal et fartøy kunne når det går med sikker fart (regel 6)?', 'What shall a vessel be able to do when proceeding at a safe speed (rule 6)?'),
    [L2('Manøvrere riktig og effektivt for å unngå sammenstøt, og stoppes på en distanse som passer til forholdene', 'Take proper and effective action to avoid collision and be stopped within a distance appropriate to the circumstances'), L2('Stoppe innen ett skips lengde', 'Stop within one ship length'), L2('Holde minst 10 knop', 'Keep at least 10 knots'), L2('Gå så fort at det unngår tåken', 'Go fast enough to outrun the fog')],
    L2('Ethvert fartøy skal alltid gå med sikker fart slik at det kan manøvrere riktig og effektivt for å unngå sammenstøt og kan stoppes på en distanse som passer til de rådende omstendigheter og forhold (regel 6).', 'Any vessel shall at all times proceed at a safe speed so that she can take proper and effective action to avoid collision and be stopped within a distance appropriate to the prevailing circumstances and conditions (rule 6).'), 'Regel 6, s. 69–70', 'u'),
  mk(L2('Hvilken av disse faktorene skal alle fartøy ta hensyn til når de fastsetter sikker fart (regel 6 (a))?', 'Which of these factors shall all vessels take into account when determining a safe speed (rule 6 (a))?'),
    [L2('Trafikktettheten, også konsentrasjoner av fiskefartøy', 'The traffic density, including concentrations of fishing vessels'), L2('Hvilket klassifikasjonsselskap fartøyet har', 'The vessel’s classification society'), L2('Hvor mange som er i mannskapet', 'The size of the crew'), L2('Avstanden til neste havn', 'The distance to the next port')],
    L2('Blant faktorene for alle fartøy står siktforholdene, trafikktettheten, manøvreringsevnen, bakgrunnsbelysning om natten, vind-, sjø- og strømforhold og dypgående i forhold til farvannsdybden (regel 6 (a)).', 'The factors for all vessels include the state of visibility, traffic density, manoeuvrability, background light at night, wind, sea and current, and the draught in relation to the depth of water (rule 6 (a)).'), 'Regel 6 (a)(ii), s. 69–70', 'u'),
  mk(L2('Hva sier regel 6 (a)(iv) om natten?', 'What does rule 6 (a)(iv) say about the night?'),
    [L2('Mulig bakgrunnsbelysning, som lys på land eller atmosfærisk refleks fra egne lanterner, skal tas med', 'The presence of background light, such as shore lights or back scatter of her own lights, shall be taken into account'), L2('Fartøyet skal alltid halvere farten', 'The vessel shall always halve its speed'), L2('Radar skal brukes i stedet for utkikk', 'Radar shall be used instead of a look-out'), L2('Lanternene skal slås av', 'The navigation lights shall be switched off')],
    L2('Om natten skal mulig bakgrunnsbelysning tas med i vurderingen av sikker fart, for eksempel lys på land eller atmosfærisk refleks fra fartøyets egne lanterner (regel 6 (a)(iv)).', 'At night the presence of background light, such as from shore lights or from back scatter of her own lights, shall be taken into account in determining a safe speed (rule 6 (a)(iv)).'), 'Regel 6 (a)(iv), s. 69–70', 'u'),
  mk(L2('Hva sier regel 6 (a)(vi) at man skal ta hensyn til?', 'What does rule 6 (a)(vi) say shall be taken into account?'),

    L2('Dypgående i forhold til den tilgjengelige farvannsdybden er en av faktorene for sikker fart (regel 6 (a)(vi)).', 'The draught in relation to the available depth of water is one of the factors for a safe speed (rule 6 (a)(vi)).'), 'Regel 6 (a)(vi), s. 69–70', 'u'),
  mk(L2('Hvilken tilleggsfaktor skal fartøy med radar ta hensyn til (regel 6 (b))?', 'Which additional factor shall vessels with operational radar take into account (rule 6 (b))?'),

    L2('Den mer nøyaktige bestemmelsen av sikten som kan være mulig når radar brukes til å måle avstand til fartøy eller andre gjenstander i nærheten, er en faktor for sikker fart (regel 6 (b)(vi)).', 'The more exact assessment of the visibility that may be possible when radar is used to determine the range of vessels or other objects in the vicinity is a factor for safe speed (rule 6 (b)(vi)).'), 'Regel 6 (b)(vi), s. 69–70', 'u'),
  mk(L2('Hva skjer med bevegelsesenergien til et skip hvis farten dobles?', 'What happens to a ship’s kinetic energy if her speed is doubled?'),

    L2('Bevegelsesenergien er proporsjonal med farten i andre potens, så dobler du farten, firedobler du energien (Boka s. 71). Det er en av grunnene til at lavere fart gir både mer tid og mindre skade.', 'Kinetic energy is proportional to the square of the speed, so doubling the speed quadruples the energy (book p. 71). That is one reason why lower speed gives both more time and less damage.'), 'Boka s. 71 (fysikk, ikke regeltekst)', 'u'),
  mk(L2('Ifølge IMOs manøvreringsstandarder (Boka): hvor stor skal «advance» høyst være?', 'According to IMO’s manoeuvrability standards (the book): what is the maximum «advance»?'),
    [L2('4,5 skipslengder', '4.5 ship lengths'), L2('1,5 skipslengder', '1.5 ship lengths'), L2('10 skipslengder', '10 ship lengths'), L2('15 skipslengder', '15 ship lengths')],
    L2('Advance er avstanden fartøyet beveger seg fremover til kursen har endret seg 90 grader. IMOs krav er høyst 4,5 skipslengder, og taktisk diameter (sideveis avstand ved 180 graders sving) høyst 5 skipslengder (Boka s. 71).', 'Advance is the distance travelled forward until the course has changed by 90 degrees. IMO requires at most 4.5 ship lengths, and the tactical diameter (lateral distance at a 180-degree turn) at most 5 ship lengths (book p. 71).'), 'Boka s. 71 (IMO-standard, ikke regeltekst)', 'u'),
  mk(L2('Mørke alene: må farten da alltid reduseres (Boka)?', 'Darkness alone: must speed always be reduced (the book)?'),
    [L2('Nei, det avhenger av de andre faktorene i regel 6, som bakgrunnsbelysning og radarens begrensninger', 'No, it depends on the other factors in rule 6, such as background light and the limitations of the radar'), L2('Ja, alltid med minst halvparten', 'Yes, always by at least half'), L2('Ja, til under 5 knop', 'Yes, to below 5 knots'), L2('Nei, mørke har ingen betydning for sikker fart', 'No, darkness has no bearing on safe speed')],
    L2('Boka (s. 71) skriver at det faktum at det er mørkt, i seg selv ikke automatisk betyr at farten må reduseres. Det avhenger av de andre faktorene i regel 6, men siktforholdene og bakgrunnsbelysning er blant dem (regel 6 (a)(i) og (iv)).', 'The book (p. 71) says that the mere fact that it is dark does not automatically mean speed must be reduced. It depends on the other factors in rule 6, though the state of visibility and background light are among them (rule 6 (a)(i) and (iv)).'), 'Boka s. 71 (tolkning, ikke regeltekst)', 'u'),
  /* ---- Regel 7 ---- */
  mk(L2('Hva skal du gjøre hvis du er i tvil om det er fare for sammenstøt (regel 7 (a))?', 'What shall you do if you are in any doubt whether risk of collision exists (rule 7 (a))?'),
    [L2('Regne med at det er fare for sammenstøt', 'Deem that such risk exists'), L2('Vente og se om avstanden minker', 'Wait and see whether the range decreases'), L2('Regne med at det ikke er fare', 'Assume that there is no risk'), L2('Kalle opp det andre fartøyet på VHF først', 'Call the other vessel on VHF first')],
    L2('Hvis det er noen tvil, skal det regnes med at det er fare for sammenstøt (regel 7 (a)).', 'If there is any doubt, such risk shall be deemed to exist (rule 7 (a)).'), 'Regel 7 (a), s. 78–79', 'f'),
  mk(L2('Hvilke midler skal brukes for å avgjøre om det er fare for sammenstøt (regel 7 (a))?', 'Which means shall be used to determine whether risk of collision exists (rule 7 (a))?'),

    L2('Ethvert fartøy skal bruke alle tilgjengelige midler som er brukbare under de rådende omstendigheter og forhold (regel 7 (a)).', 'Any vessel shall use all available means appropriate to the prevailing circumstances and conditions (rule 7 (a)).'), 'Regel 7 (a), s. 78–79', 'f'),
  mk(L2('Hvordan skal radar brukes når den er anbrakt og brukbar (regel 7 (b))?', 'How shall radar be used if fitted and operational (rule 7 (b))?'),

  mk(L2('Hva sier regel 7 (c) om slutninger du trekker?', 'What does rule 7 (c) say about the conclusions you draw?'),

    L2('Slutninger skal ikke trekkes på grunnlag av sparsomme opplysninger, spesielt sparsomme radaropplysninger (regel 7 (c)).', 'Assumptions shall not be made on the basis of scanty information, especially scanty radar information (rule 7 (c)).'), 'Regel 7 (c), s. 78–79', 'f'),
  mk(L2('AIS er ikke nevnt i sjøveisreglene. Hvordan bør AIS-informasjon brukes ifølge Boka?', 'AIS is not mentioned in the Rules. How should AIS information be used according to the book?'),

    L2('Boka (s. 79 og s. 83) skriver at AIS ikke erstatter, men kommer i tillegg til det man får ved å plotte på radar og fra VTS. Siden AIS bruker kurs over grunnen, stemmer ikke vektorene alltid med aspektvinklene, og det er aspektvinklene som avgjør hvem som skal vike.', 'The book (pp. 79 and 83) says that AIS does not replace, but adds to, what you get by plotting on radar and from VTS. Since AIS uses course over ground, vectors do not always match the aspect angles, and it is the aspect angles that decide who gives way.'), 'Boka s. 79, s. 83 (tolkning, ikke regeltekst)', 'f'),
  mk(L2('Hvilken radarvektor viser nærmeste passeringsavstand (CPA) og faren for sammenstøt (Boka)?', 'Which radar vector shows the closest point of approach (CPA) and the risk of collision (the book)?'),
    [L2('Relativ vektor', 'The relative vector'), L2('Sann vektor', 'The true vector'), L2('Baugvisiren (heading line)', 'The heading line'), L2('Bare ekkosporet bakover', 'The echo trail astern only')],
    L2('Boka (s. 79) skriver at det er den relative vektoren som viser faren for kollisjon og hvor nærmeste passeringspunkt vil være. Det tar noen minutter før radaren har nok plott til å gi stabile data (s. 80).', 'The book (p. 79) says it is the relative vector that shows the danger of collision and where the closest point of approach will be. It takes a few minutes before the radar has enough plots to give stable data (p. 80).'), 'Boka s. 79–80 (radarteknikk, ikke regeltekst)', 'f'),
  mk(L2('Hva betyr TCPA (Boka)?', 'What does TCPA mean (the book)?'),

    L2('TCPA er tiden til nærmeste passeringspunkt. Avstanden ved nærmeste passering kalles CPA (Boka s. 19 og s. 80–81).', 'TCPA is the time to the closest point of approach. The distance at closest approach is called CPA (book pp. 19 and 80–81).'), 'Boka s. 19, s. 80–81 (begrep, ikke regeltekst)', 'f'),
  /* ---- Regel 9 ---- */
  mk(L2('Hvor i en trang lei skal et fartøy holde seg, når det lar seg gjøre uten fare (regel 9 (a))?', 'Where in a narrow channel shall a vessel keep, when it is safe and practicable (rule 9 (a))?'),
    [L2('Så nær som mulig til leias yttergrense på sin styrbord side', 'As near as possible to the outer limit of the channel on her starboard side'), L2('Midt i leia', 'In the middle of the channel'), L2('Så nær som mulig til leias yttergrense på sin babord side', 'As near as possible to the outer limit of the channel on her port side'), L2('Der det er dypest, uansett side', 'Where it is deepest, whichever side')],
    L2('Et fartøy som seiler i en trang lei, skal holde seg så nær som mulig til den av yttergrensene som det har på sin styrbord side, når det lar seg gjøre uten fare (regel 9 (a)).', 'A vessel proceeding along a narrow channel shall keep as near to the outer limit which lies on her starboard side as is safe and practicable (rule 9 (a)).'), 'Regel 9 (a), s. 90', 't'),

    L2('Et fartøy som holder på med å fiske, skal ikke hindre eller vanskeliggjøre gjennomfarten for noe annet fartøy som navigerer innenfor en trang lei (regel 9 (c)).', 'A vessel engaged in fishing shall not impede the passage of any other vessel navigating within a channel or fairway (rule 9 (c)).'), 'Regel 9 (c), s. 90', 't'),
  mk(L2('Når skal et fartøy ikke krysse en trang lei (regel 9 (d))?', 'When shall a vessel not cross a narrow channel (rule 9 (d))?'),

    L2('Et fartøy skal ikke krysse en trang lei hvis krysningen hindrer eller vanskeliggjør gjennomfarten for et fartøy som bare kan navigere sikkert innenfor leia (regel 9 (d)).', 'A vessel shall not cross a narrow channel if such crossing impedes the passage of a vessel which can navigate safely only within such channel (rule 9 (d)).'), 'Regel 9 (d), s. 90', 't'),
  mk(L2('Hvilket signal kan fartøyet som bare kan navigere innenfor leia, gi hvis det er i tvil om hva det kryssende fartøyet akter å gjøre (regel 9 (d))?', 'Which signal may the vessel that can navigate only within the channel give, if in doubt about the intention of the crossing vessel (rule 9 (d))?'),

    L2('Det kan bruke lydsignalet som er foreskrevet i regel 34 (d): minst fem korte og raske støt (regel 9 (d)).', 'It may use the sound signal prescribed in rule 34 (d): at least five short and rapid blasts (rule 9 (d)).'), 'Regel 9 (d), s. 90; regel 34 (d), s. 216–217', 't'),
  mk(L2('Du vil gå forbi et fartøy i en trang lei der det må manøvrere for at du kan komme forbi, og du akter å gå på dets styrbord side. Hvilket signal gir du (regel 9 (e)(i), regel 34 (c)(i))?', 'You intend to overtake a vessel in a narrow channel where she must act to let you pass, on her starboard side. Which signal do you give (rule 9 (e)(i), rule 34 (c)(i))?'),
    [L2('To lange støt etterfulgt av ett kort', 'Two prolonged blasts followed by one short blast'), L2('To lange støt etterfulgt av to korte', 'Two prolonged blasts followed by two short blasts'), L2('Ett langt, ett kort, ett langt og ett kort støt', 'One prolonged, one short, one prolonged and one short blast'), L2('Minst fem korte og raske støt', 'At least five short and rapid blasts')],
    L2('To lange støt etterfulgt av ett kort betyr «jeg akter å gå forbi på deres styrbord side», og to lange etterfulgt av to korte betyr «på deres babord side» (regel 34 (c)(i)).', 'Two prolonged blasts followed by one short blast mean “I intend to overtake you on your starboard side”, and two prolonged followed by two short mean “on your port side” (rule 34 (c)(i)).'), 'Regel 9 (e)(i), s. 90; regel 34 (c)(i), s. 216–217', 't'),
  mk(L2('Du blir innhentet i en trang lei og er enig i at det andre fartøyet går forbi. Hvilket signal gir du (regel 9 (e)(i), regel 34 (c)(ii))?', 'You are being overtaken in a narrow channel and agree to the other vessel passing. Which signal do you give (rule 9 (e)(i), rule 34 (c)(ii))?'),

    L2('Fartøyet som innhentes skal, hvis det er enig, gi signalet lang-kort-lang-kort (regel 34 (c)(ii)) og ta skritt for å tillate sikker passering (regel 9 (e)(i)). Hvis det er i tvil, kan det gi signalene i regel 34 (d).', 'The vessel to be overtaken shall, if in agreement, sound the signal prolonged-short-prolonged-short (rule 34 (c)(ii)) and take steps to permit safe passing (rule 9 (e)(i)). If in doubt she may sound the signals in rule 34 (d).'), 'Regel 9 (e)(i), s. 90; regel 34 (c)(ii), s. 216–217', 't'),

function factQuestion(i) {
  const f = FACTS[i];
  return { kind: 'mc', pool: 'f' + i, stem: f.q, opts: shuffle(f.o.map((x, j) => ({ id: 'o' + j, nb: x.nb, en: x.en }))), ok: 'o0', x: f.x, ref: f.ref };
}
const FIDX = g => FACTS.map((f, i) => i).filter(i => g.includes(FACTS[i].g));

/* ---------- Runde ---------- */
function typesFor(mode) {
  if (mode === 'utk') return shuffle(['fu', 'fu', 'fu', 'fu', 'fu', 'fu', 'fu', 'fu', 'fu', 'stop']);
  if (mode === 'fare') return shuffle(['bc', 'bx', 'tcpa', 'tcpa', 'ff', 'ff', 'ff', 'ff', 'ff', 'ff']);
  if (mode === 'trang') return shuffle(['chan', 'chan', 'ft', 'ft', 'ft', 'ft', 'ft', 'ft', 'ft', 'ft']);
  if (mode === 'tss') return shuffle(['tcross', 'tcross', 'tjoin', 'fs', 'fs', 'fs', 'fs', 'fs', 'fs', 'fs']);
  return shuffle(['fu', 'fu', 'bc', 'tcpa', 'ff', 'chan', 'ft', 'tcross', 'fs', 'fs']);
}
function makeRound(mode) {
  const fu = cycle(FIDX(['u'])), ff = cycle(FIDX(['f'])), ft = cycle(FIDX(['t'])), fs = cycle(FIDX(['s']));
  const out = [], used = new Set();
  typesFor(mode).forEach(t => {
    for (let tries = 0; tries < 40; tries++) {
      let q;
      if (t === 'fu') q = factQuestion(fu());
      else if (t === 'ff') q = factQuestion(ff());
      else if (t === 'ft') q = factQuestion(ft());
      else if (t === 'fs') q = factQuestion(fs());
      else if (t === 'bc') q = bearQuestion('const');
      else if (t === 'bx') q = bearQuestion('change');
      else if (t === 'tcpa') q = tcpaQuestion();
      else if (t === 'stop') q = stopQuestion();
      else if (t === 'chan') q = chanQuestion();
      else if (t === 'tcross') q = tssCrossQuestion();
      else q = tssJoinQuestion();
      if (!used.has(q.pool) || tries === 39) { used.add(q.pool); out.push(q); break; }
    }
  });
  return out;
}

  function sceneFor(q, solved) {
    if (!q.scene) return '';
    const tx = { you: t('you'), min: t('min'), sceneAlt: t('sceneAlt'), bearAlt: t('bearAlt'), chanAlt: t('chanAlt'), tssAlt: t('tssAlt'), zone: t('zone') };

  function answer(a) {
    if (round.answered) return;

    if (a === q.ok) {

      const secs = (Date.now() - round.qStart) / 1000;
      round.pts += 100 + Math.max(0, Math.round(50 - secs * 3));

    const cards = document.createElement('div'); cards.className = 'cards'; box.appendChild(cards);
    order.slice(0, 3).forEach((g, k) => {

    const L = nb ? { h: 'Del resultatet', share: 'Del …', copy: 'Kopier lenke', copied: 'Kopiert!' } : { h: 'Share result', share: 'Share …', copy: 'Copy link', copied: 'Copied!' };
    const enc = encodeURIComponent;

    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);

      [['WhatsApp', 'https://wa.me/?text=' + enc(text + ' ' + url)],

        const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = n; row.appendChild(a);
      });
    }
    const c = document.createElement('button'); c.type = 'button'; c.textContent = L.copy;
    c.addEventListener('click', () => {
      const done = () => { c.textContent = L.copied; setTimeout(() => { c.textContent = L.copy; }, 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
      else { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ingen */ } document.body.removeChild(ta); done(); }
    });
    row.appendChild(c);
  }

  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    $('resTitle').textContent = t('resTitle')(round.correct, N);
    $('resText').textContent = t('resText')(fmt(round.time), round.pts);
    if (!round.wrong.length) { $('resReview').innerHTML = `<p>${t('perfect')}</p>`; }
    else {
      const seen = new Set();
      const items = round.wrong.filter(q => { const k = q.ref + q.x.nb; return !seen.has(k) && seen.add(k); })
        .map(q => `<li><b>${q.stem[lang].length > 150 ? q.stem[lang].slice(0, 147) + '…' : q.stem[lang]}</b> ${q.x[lang]} <span style="color:var(--muted)">(${q.ref})</span></li>`).join('');
      $('resReview').innerHTML = `<p><b>${t('reviewTitle')}</b></p><ul class="review">${items}</ul>`;
    }
    showBest();
    renderShare();
    renderMore();
    $('again').focus({ preventScroll: true });
  }

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', () => { $('result').hidden = true; $('start').hidden = false; round = null; showBest(); });

  document.addEventListener('keydown', e => {
    if ($('play').hidden || !round || e.ctrlKey || e.metaKey || e.altKey) return;
    const q = round.qs[round.n];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !round.answered && q.opts[n - 1]) answer(q.opts[n - 1].id);
  });

  applyLang();
})();

if (typeof module !== 'undefined') module.exports = { FACTS, makeRound, bearQuestion, chanQuestion, tssCrossQuestion, tssJoinQuestion, tcpaQuestion, stopQuestion, factQuestion, bearSVG, chanSVG, tssSVG, crossScene, joinScene, N, T };

<script id="musikk-js">
/* MUSIKK-BEGIN */
(function () {
  var d = document, root = d.documentElement, game = d.body.dataset.game || '';
  var go = d.getElementById('go'); if (!go || d.getElementById('musikk')) return;
  var KEY = game === 'lydsignaler' ? 'cphd-music-lyd' : 'cphd-music';
  var SRC = (location.pathname.replace(/[^\/]*$/, '').replace(/[^\/]+\/$/, '') || '/') + 'audio/tema.mp3';
  var V = 0.35, X = 1500;
  var T = { nb: { on: 'Musikk: på', off: 'Musikk: av', note: 'Musikk laget med KI (Google Lyria)' },
            en: { on: 'Music: on', off: 'Music: off', note: 'Music made with AI (Google Lyria)' } };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var want = store.get(KEY) === '1';           // brukerens valg (lagres)
  var playing = false, hold = false, cur = 0, timer = null, resumeT = null, started = false;
  var tracks = [new Audio(), new Audio()];
  tracks.forEach(function (a) { a.preload = 'none'; a.volume = 0; a.setAttribute('playsinline', ''); });

  var p = d.createElement('p'); p.className = 'musikk';
  p.innerHTML = '<button type="button" id="musikk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg><span></span></button><span class="muz-note"></span>';
  go.parentNode.insertBefore(p, go.nextSibling);
  var btn = p.querySelector('button'), label = btn.querySelector('span'), note = p.querySelector('.muz-note');

  function L() { return T[root.lang === 'en' ? 'en' : 'nb']; }
  function render() { label.textContent = want ? L().on : L().off; btn.setAttribute('aria-pressed', want ? 'true' : 'false'); note.textContent = L().note; }
  function fade(a, to, ms, done) {
    if (a._f) clearInterval(a._f);
    var from = a.volume, t0 = Date.now();
    a._f = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) { clearInterval(a._f); a._f = null; if (done) done(); }
    }, 50);
  }
  function begin(i) {
    var a = tracks[i]; if (!a.src) a.src = SRC;
    try { a.currentTime = 0; } catch (e) {}
    var pr = a.play(); if (pr && pr.catch) pr.catch(function () { playing = false; });
    fade(a, V, X);
  }
  function watch() {
    var a = tracks[cur];
    if (playing && a.duration && !a.paused && a.currentTime >= a.duration - X / 1000 - 0.1) {
      fade(a, 0, X, function () { a.pause(); });
      cur = 1 - cur; begin(cur);
    }
  }
  function start() {
    if (playing || hold || !want) return;
    playing = true; begin(cur);
    if (!timer) timer = setInterval(watch, 200);
  }
  function stop(ms) {
    playing = false;
    tracks.forEach(function (a) { fade(a, 0, ms == null ? 500 : ms, function () { if (!playing) a.pause(); }); });
  }
  btn.addEventListener('click', function () {
    want = !want; store.set(KEY, want ? '1' : '0'); render();
    if (want) { hold = false; start(); } else stop();
  });
  /* starter bare etter brukerklikk på Start, hvis brukeren allerede har valgt musikk */
  go.addEventListener('click', function () { if (want) start(); });
  /* signalspill: pause musikken mens lydsignalet spilles */
  d.addEventListener('cphd:sound', function (e) {
    if (!want || !playing) return;
    var sec = (e.detail && e.detail.sec) || 6;
    hold = true; stop(200);
    clearTimeout(resumeT);
    resumeT = setTimeout(function () { hold = false; if (want) start(); }, sec * 1000 + 800);
  });
  d.addEventListener('visibilitychange', function () {
    if (d.hidden) { if (playing) { stop(100); playing = false; started = true; } }
    else if (started && want) { started = false; start(); }
  });
  new MutationObserver(render).observe(root, { attributes: true, attributeFilter: ['lang'] });
  render();
})();
/* MUSIKK-END */
