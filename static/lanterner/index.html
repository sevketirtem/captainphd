<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanterner og dagsignaler · Captain PhD</title>
<meta name="description" content="Kjenn igjen fartøyet på lanternene om natten og signalfigurene om dagen. Sjøveisreglene regel 20–31. Gratis læringsspill.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f3ec; --surface: #fff; --fg: #0b2233; --muted: #4d6170; --line: #d9d3c4;
  --signal: #d6402f; --sea: #1d5c7a; --ok: #1f7a4d; --bad: #b3261e;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a1822; --surface: #10222f; --fg: #e8eef2; --muted: #9fb2bf; --line: #22394a;
    --signal: #ef5a48; --sea: #6fb3d2; --ok: #4cc38a; --bad: #ff7a70; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
a { color: var(--sea); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
.home { color: var(--fg); text-decoration: none; font-weight: 800; }
.lang { font: 13px var(--mono); text-transform: uppercase; letter-spacing: .06em; background: none; color: var(--fg);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.15; margin: 6px 0 8px; }
.lede { color: var(--muted); margin: 0 0 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 16px; }
.modes button, .opts button, .primary {
  font: inherit; cursor: pointer; border-radius: 8px; padding: 12px; text-align: left;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.modes button[aria-pressed="true"] { border-color: var(--sea); box-shadow: inset 0 0 0 2px var(--sea); }
.modes b { display: block; }
.modes span { font-size: 13px; color: var(--muted); }
.primary { background: var(--signal); border-color: var(--signal); color: #fff; font-weight: 700; text-align: center; width: 100%; }
.primary:focus-visible, .opts button:focus-visible, .modes button:focus-visible, .lang:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
.bar { display: flex; justify-content: space-between; font: 14px var(--mono); color: var(--muted); margin-bottom: 10px; }
.scene { display: block; width: 100%; height: auto; border-radius: 8px; }
.q { font-weight: 700; margin: 14px 0 10px; }
.opts { display: grid; gap: 8px; }
.opts button { display: flex; gap: 10px; align-items: baseline; }
.opts kbd { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.opts button.right { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
.opts button.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
.opts button:disabled { cursor: default; }
.explain { margin-top: 12px; padding: 12px; border-left: 4px solid var(--sea); background: var(--bg); border-radius: 0 8px 8px 0; }
.explain b.ok { color: var(--ok); } .explain b.bad { color: var(--bad); }
.next { margin-top: 12px; }
.result h2 { margin: 0 0 6px; }
.review { padding-left: 18px; }
.review li { margin-bottom: 8px; }
footer { font-size: 13px; color: var(--muted); padding: 24px 0 36px; }
footer p { margin: 0 0 6px; }
.blink { animation: blink .5s steps(1) infinite; }
@keyframes blink { 50% { opacity: .08; } }
@media (prefers-reduced-motion: reduce) { .blink { animation-duration: 1s; } }
@media (max-width: 420px) { .modes { grid-template-columns: 1fr; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="../" data-href-nb="../" data-href-en="../en/">Captain PhD</a>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <main>
    <section id="start">
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
      <div class="panel">
        <b data-t="chooseMode"></b>
        <div class="modes" role="group">
          <button type="button" data-mode="natt" aria-pressed="true"><b data-t="mNight"></b><span data-t="mNightSub"></span></button>
          <button type="button" data-mode="dag" aria-pressed="false"><b data-t="mDay"></b><span data-t="mDaySub"></span></button>
          <button type="button" data-mode="blandet" aria-pressed="false"><b data-t="mMix"></b><span data-t="mMixSub"></span></button>
        </div>
        <button class="primary" id="go" type="button" data-t="start"></button>
        <p id="best" class="lede" style="margin:10px 0 0"></p>
      </div>
    </section>

    <section id="play" hidden>
      <div class="panel">
        <div class="bar"><span id="count"></span><span id="clock">0:00</span><span id="score"></span></div>
        <div id="sceneBox"></div>
        <p class="q" id="question"></p>
        <div class="opts" id="opts"></div>
        <div class="explain" id="explain" hidden aria-live="polite"></div>
        <button class="primary next" id="next" type="button" hidden></button>
      </div>
    </section>

    <section id="result" hidden>
      <div class="panel result">
        <h2 id="resTitle"></h2>
        <p id="resText"></p>
        <div id="resReview"></div>
        <button class="primary" id="again" type="button" data-t="again"></button>
      </div>
    </section>
  </main>

  <footer>
    <p data-t="disclaimer"></p>
    <p data-t="source"></p>
    <p data-t="licence"></p>
  </footer>
</div>

<script>

   Faktatabell: captainphd-prosjektet, k52-lanterner-faktatabell.md

/* ---------- Svar (fartøy) med forklaring og kildehenvisning ----------
   ref = regel og side i K52. Tekstene følger faktatabellen. */
const A = {
  pd50: { nb: 'Maskindrevet fartøy underveis, 50 m eller mer', en: 'Power-driven vessel underway, 50 m or more',
    xnb: 'To topplanterner (den akterste høyest), sidelanterner og akterlanterne.', xen: 'Two masthead lights (the after one higher), sidelights and a sternlight.', ref: 'Regel/Rule 23 (a), K52 s. 172' },
  pdS: { nb: 'Maskindrevet fartøy underveis, under 50 m', en: 'Power-driven vessel underway, less than 50 m',
    xnb: 'Én topplanterne, sidelanterner og akterlanterne. Under 50 m er den andre topplanternen frivillig.', xen: 'One masthead light, sidelights and a sternlight. Below 50 m the second masthead light is optional.', ref: 'Regel/Rule 23 (a) ii, K52 s. 172' },
  acv: { nb: 'Luftputefartøy uten deplasement', en: 'Air-cushion vessel in non-displacement mode',
    xnb: 'Lanterner som maskindrevet fartøy, og i tillegg en rundtlysende blinkende gul lanterne.', xen: 'Lights of a power-driven vessel plus an all-round flashing yellow light.', ref: 'Regel/Rule 23 (b), K52 s. 172' },
  tow: { nb: 'Slep, slepets lengde 200 m eller mindre', en: 'Towing, length of tow 200 m or less',
    xnb: 'To topplanterner loddrett, sidelanterner, akterlanterne og en gul slepelanterne over akterlanternen.', xen: 'Two masthead lights in a vertical line, sidelights, a sternlight and a yellow towing light above the sternlight.', ref: 'Regel/Rule 24 (a), K52 s. 178' },
  towL: { nb: 'Slep, slepets lengde over 200 m', en: 'Towing, length of tow exceeds 200 m',
    xnb: 'Tre topplanterner loddrett, sidelanterner, akterlanterne og gul slepelanterne. Om dagen: en terningformet signalfigur.', xen: 'Three masthead lights in a vertical line, sidelights, a sternlight and a yellow towing light. By day: a diamond shape.', ref: 'Regel/Rule 24 (a), K52 s. 178' },
  sail: { nb: 'Seilfartøy underveis', en: 'Sailing vessel underway',
    xnb: 'Sidelanterner og akterlanterne, ingen topplanterne. Kan i tillegg vise rød over grønn rundtlysende på mastetoppen.', xen: 'Sidelights and a sternlight, no masthead light. May also show all-round red over green at the masthead.', ref: 'Regel/Rule 25 (a), (c), K52 s. 182' },
  motorsail: { nb: 'Seilfartøy som også drives av maskin', en: 'Vessel under sail also propelled by machinery',
    xnb: 'Om dagen: en kjegle med spissen ned forut.', xen: 'By day: a cone, apex downwards, forward.', ref: 'Regel/Rule 25 (e), K52 s. 182' },
  trawl: { nb: 'Fartøy som tråler', en: 'Vessel engaged in trawling',
    xnb: 'Grønn over hvit rundtlysende. Topplanterne akterut og høyere (påbudt fra 50 m). Gjør det fart: også side- og akterlanterne.', xen: 'All-round green over white. A masthead light abaft of and higher than the green (required from 50 m). Making way: also sidelights and a sternlight.', ref: 'Regel/Rule 26 (b), K52 s. 187' },
  fish: { nb: 'Fartøy som fisker, ikke med trål', en: 'Vessel engaged in fishing, other than trawling',
    xnb: 'Rød over hvit rundtlysende. Gjør det fart: også side- og akterlanterne.', xen: 'All-round red over white. Making way: also sidelights and a sternlight.', ref: 'Regel/Rule 26 (c), K52 s. 187' },
  fishDay: { nb: 'Fartøy som fisker', en: 'Vessel engaged in fishing',
    xnb: 'To kjegler med spissene sammen, både ved tråling og annet fiske.', xen: 'Two cones with their apexes together, for trawling and other fishing alike.', ref: 'Regel/Rule 26 (b), (c), K52 s. 187' },
  fishGear: { nb: 'Fartøy som fisker, redskap ute over 150 m', en: 'Vessel fishing, gear extending more than 150 m',
    xnb: 'To kjegler med spissene sammen, og en kjegle med spissen opp i retning mot redskapen.', xen: 'Two cones with apexes together, and a cone apex upwards in the direction of the gear.', ref: 'Regel/Rule 26 (c) ii, K52 s. 187' },
  nuc: { nb: 'Fartøy som ikke er under kommando', en: 'Vessel not under command',
    xnb: 'To røde rundtlysende loddrett (dag: to kuler). Gjør det fart: også side- og akterlanterne, men ingen topplanterne.', xen: 'Two all-round red lights in a vertical line (day: two balls). Making way: also sidelights and a sternlight, but no masthead light.', ref: 'Regel/Rule 27 (a), K52 s. 195' },
  ram: { nb: 'Fartøy med begrenset manøvreringsevne', en: 'Vessel restricted in her ability to manoeuvre',
    xnb: 'Rød, hvit, rød rundtlysende loddrett (dag: kule, terningformet, kule). Gjør det fart: også topplanterner, side- og akterlanterne.', xen: 'All-round red, white, red in a vertical line (day: ball, diamond, ball). Making way: also masthead lights, sidelights and a sternlight.', ref: 'Regel/Rule 27 (b), K52 s. 195' },
  ramTow: { nb: 'Slep som sterkt begrenser evnen til å avvike fra kursen', en: 'Towing operation severely restricting ability to deviate from course',
    xnb: 'Slepelanterner etter regel 24 (a) og i tillegg rød, hvit, rød rundtlysende (dag: kule, terningformet, kule).', xen: 'Towing lights under Rule 24 (a) plus all-round red, white, red (day: ball, diamond, ball).', ref: 'Regel/Rule 27 (c), K52 s. 195' },
  dredge: { nb: 'Mudring eller undervannsarbeid, med hindring', en: 'Dredging or underwater operations, with obstruction',
    xnb: 'Rød, hvit, rød. To røde (dag: to kuler) på siden med hindring, to grønne (dag: to terningformede) på siden der man kan passere.', xen: 'Red, white, red. Two red (day: two balls) on the obstructed side, two green (day: two diamonds) on the side where vessels may pass.', ref: 'Regel/Rule 27 (d), K52 s. 195' },
  dive: { nb: 'Lite fartøy med dykkerarbeid', en: 'Small vessel engaged in diving operations',
    xnb: 'Om dagen: en skjerm minst 1 m høy som signalflagg «A». Om natten: rød, hvit, rød.', xen: 'By day: a rigid replica of signal flag "A", at least 1 m high. At night: red, white, red.', ref: 'Regel/Rule 27 (e), K52 s. 195' },
  mine: { nb: 'Fartøy som fjerner miner', en: 'Vessel engaged in mine clearance',
    xnb: 'Tre grønne rundtlysende (dag: tre kuler): én nær toppen av formasten og én i hver nokk av signalråen. Hold minst 1000 m avstand.', xen: 'Three all-round green lights (day: three balls): one near the foremast head and one at each end of the yard. Keep more than 1000 m away.', ref: 'Regel/Rule 27 (f), K52 s. 195' },
  cbd: { nb: 'Fartøy hemmet av sitt dypgående', en: 'Vessel constrained by her draught',
    xnb: 'Lanterner som maskindrevet fartøy og tre røde rundtlysende loddrett. Om dagen: en sylinder.', xen: 'Lights of a power-driven vessel plus three all-round red lights in a vertical line. By day: a cylinder.', ref: 'Regel/Rule 28, K52 s. 205' },
  pilot: { nb: 'Losfartøy på oppdrag', en: 'Pilot vessel on pilotage duty',
    xnb: 'Hvit over rød rundtlysende på eller nær mastetoppen. Underveis også side- og akterlanterne.', xen: 'All-round white over red at or near the masthead. Underway also sidelights and a sternlight.', ref: 'Regel/Rule 29 (a), K52 s. 208' },
  anchor50: { nb: 'Fartøy til ankers, 50 m eller mer', en: 'Vessel at anchor, 50 m or more',
    xnb: 'Hvit rundtlysende forut, og en lavere hvit rundtlysende akterut.', xen: 'An all-round white light forward and a lower all-round white light aft.', ref: 'Regel/Rule 30 (a), K52 s. 210' },
  anchorDay: { nb: 'Fartøy til ankers', en: 'Vessel at anchor',
    xnb: 'Om dagen: én kule forut.', xen: 'By day: one ball forward.', ref: 'Regel/Rule 30 (a), K52 s. 210' },
  aground: { nb: 'Fartøy på grunn', en: 'Vessel aground',
    xnb: 'Ankerlanternene og to røde rundtlysende loddrett. Om dagen: tre kuler loddrett.', xen: 'Anchor lights plus two all-round red lights in a vertical line. By day: three balls in a vertical line.', ref: 'Regel/Rule 30 (d), K52 s. 210' }

/* ---------- Byggeklosser for lanterner ----------
   Skipskoordinater: x = 0 (akterende) … 100 (baugen), h = høyde over vannet,
   lat = sideveis (+ = styrbord). */
const L = {
  mh: (x, h) => ({ k: 'mh', c: 'w', x, h, lat: 0 }),                 // topplanterne 225°
  sides: (x = 64, h = 18) => [{ k: 'sg', c: 'g', x, h, lat: 10 }, { k: 'sr', c: 'r', x, h, lat: -10 }],
  stern: (h = 12) => ({ k: 'st', c: 'w', x: 1, h, lat: 0 }),          // akterlanterne 135°
  towL: (h = 20) => ({ k: 'tw', c: 'y', x: 1, h, lat: 0 }),           // slepelanterne, gul 135°
  all: (c, x, h, lat = 0, blink = false) => ({ k: 'al', c, x, h, lat, blink }) // rundtlysende 360°
};
const sidesStern = () => [...L.sides(), L.stern()];
const pd50Lights = () => [L.mh(84, 30), L.mh(40, 48), ...sidesStern()];
const pdSLights = () => [L.mh(70, 38), ...sidesStern()];
const tugLights = n => [...Array(n)].map((_, i) => L.mh(72, 30 + i * 8)).concat(L.sides(60, 16), L.stern(10), L.towL(18));
// Topplanternene skal stå over alle andre lanterner (vedlegg I nr. 2 f, K52 s. 252); derfor høye topplanterner når det er signallanterner
const pdHigh = () => [L.mh(84, 54), L.mh(40, 68), ...L.sides(64, 16), L.stern()];
const rwr = (x, top) => [L.all('r', x, top), L.all('w', x, top - 8), L.all('r', x, top - 16)];

/* ---------- Senarioer ----------
   mode: natt (lanterner) eller dag (signalfigurer). views: hvilke synsvinkler som er tillatt.
   Natt: forfra, styrbord, babord, akterfra. Dag: profil (styrbord/babord) eller forfra. */
const SC = [
  // Natt
  { a: 'pd50', mode: 'natt', views: ['forfra', 'styrbord', 'babord'], el: pd50Lights() },
  { a: 'pdS', mode: 'natt', views: ['forfra', 'styrbord', 'babord'], el: pdSLights() },
  { a: 'acv', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [...pdSLights(), L.all('y', 40, 30, 0, true)] },
  { a: 'tow', mode: 'natt', views: ['styrbord', 'babord', 'akterfra'], el: tugLights(2) },
  { a: 'towL', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: tugLights(3) },
  { a: 'sail', mode: 'natt', views: ['forfra', 'styrbord', 'babord'], el: [...L.sides(70, 10), L.stern(8)], hull: 'seil' },
  { a: 'sail', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [...L.sides(70, 10), L.stern(8), L.all('r', 50, 62), L.all('g', 50, 54)], hull: 'seil' },
  { a: 'trawl', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('g', 70, 36), L.all('w', 70, 28), L.mh(36, 46), ...sidesStern()] },
  { a: 'trawl', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('g', 70, 36), L.all('w', 70, 28), L.mh(36, 46)] },
  { a: 'fish', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('r', 66, 36), L.all('w', 66, 28), ...sidesStern()] },
  { a: 'fish', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('r', 66, 36), L.all('w', 66, 28)] },
  { a: 'nuc', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('r', 56, 44), L.all('r', 56, 36)] },
  { a: 'nuc', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [L.all('r', 56, 44), L.all('r', 56, 36), ...sidesStern()] },
  { a: 'ram', mode: 'natt', views: ['forfra', 'styrbord', 'babord', 'akterfra'], el: [...rwr(56, 42), ...pdHigh()] },

/* ---------- Synlighet etter sektor (regel 21) ---------- */
function visible(e, view) {
  if (e.k === 'al') return true;                                   // rundtlysende
  if (e.k === 'mh') return view !== 'akterfra';                    // 225° forover
  if (e.k === 'sg') return view === 'forfra' || view === 'styrbord';
  if (e.k === 'sr') return view === 'forfra' || view === 'babord';
  if (e.k === 'st' || e.k === 'tw') return view === 'akterfra';    // 135° akterover
  return false;
}

/* ---------- Skjermkoordinater ---------- */
const W = 400, HZ = 196, SCALE = 2.6;
function toScreen(p, view) {
  const lat = p.lat || 0;
  let x;
  if (view === 'styrbord') x = 50 + p.x * 3;          // baugen til høyre
  else if (view === 'babord') x = 350 - p.x * 3;      // baugen til venstre
  else if (view === 'forfra') x = W / 2 - lat * 2.4;  // fartøyets styrbord er til venstre for oss
  else x = W / 2 + lat * 2.4;                          // akterfra
  return { x: Math.round(x), y: Math.round(HZ - p.h * SCALE) };
}

/* Signatur: det man faktisk ser. Brukes for å fjerne tvetydige spørsmål. */
function signature(sc, view) {
  const items = sc.mode === 'natt'
    ? sc.el.filter(e => visible(e, view)).map(e => { const p = toScreen(e, view); return `${e.c}${e.blink ? '*' : ''}@${Math.round(p.x / 12)},${Math.round(p.y / 12)}`; })
    : sc.sh.map(s => { const p = toScreen(s, view); return `${s.s}@${Math.round(p.x / 12)},${Math.round(p.y / 12)}`; });
  return sc.mode + ':' + items.sort().join('|');
}

/* Bygg spørsmålsbanken: (senario, synsvinkel) — fjern dem der to ulike svar ser like ut */
function buildBank() {
  const all = [];
  SC.forEach((sc, i) => sc.views.forEach(v => all.push({ i, v, sig: signature(sc, v), a: sc.a, mode: sc.mode })));
  const bySig = {};
  all.forEach(q => { (bySig[q.sig] = bySig[q.sig] || new Set()).add(q.a); });
  const ok = all.filter(q => bySig[q.sig].size === 1);
  const dropped = all.filter(q => bySig[q.sig].size > 1);
  return { ok, dropped };
}

/* Likhet mellom fartøy: hvilke farger (natt) eller figurer (dag) som inngår */
function tokens(sc) {
  const list = sc.mode === 'natt' ? sc.el.filter(e => e.k === 'al' || e.k === 'mh').map(e => e.c + (e.blink ? '*' : '')) : sc.sh.map(x => x.s);
  const m = {}; list.forEach(k => { m[k] = (m[k] || 0) + 1; }); return m;
}
function answerTokens(a, mode) {
  const m = {}; SC.filter(sc => sc.a === a && sc.mode === mode).forEach(sc => { const t = tokens(sc); for (const k in t) m[k] = Math.max(m[k] || 0, t[k]); }); return m;
}
function likeness(x, y) {
  let both = 0, any = 0; new Set([...Object.keys(x), ...Object.keys(y)]).forEach(k => { both += Math.min(x[k] || 0, y[k] || 0); any += Math.max(x[k] || 0, y[k] || 0); });
  return any ? both / any : 0;
}

/* ---------- Tegning (SVG) ---------- */
const NS = 'http://www.w3.org/2000/svg';
function hullProfile(kind, view, day) {
  const flip = view === 'babord';
  const X = x => flip ? 350 - x * 3 : 50 + x * 3;
  const Y = h => HZ - h * SCALE;
  const fill = day ? '#3a4a55' : '#0e1a22';
  const P = pts => pts.map(([x, h]) => `${X(x)},${Y(h)}`).join(' ');
  let s = '';
  if (kind === 'seil') {
    s += `<polygon points="${P([[4, 4], [96, 6], [88, -2], [10, -2]])}" fill="${fill}"/>`;
    s += `<line x1="${X(50)}" y1="${Y(4)}" x2="${X(50)}" y2="${Y(66)}" stroke="${fill}" stroke-width="2"/>`;
    s += `<polygon points="${P([[50, 64], [50, 10], [22, 10]])}" fill="${day ? '#e9e4d8' : '#16232c'}" stroke="${fill}"/>`;
    s += `<polygon points="${P([[52, 60], [52, 12], [86, 8]])}" fill="${day ? '#e9e4d8' : '#16232c'}" stroke="${fill}"/>`;
    if (day) s += `<line x1="${X(88)}" y1="${Y(6)}" x2="${X(88)}" y2="${Y(30)}" stroke="${fill}" stroke-width="2"/>`;
    return s;
  }
  if (kind === 'liten') {
    s += `<polygon points="${P([[30, 4], [72, 5], [68, -2], [33, -2]])}" fill="${fill}"/>`;
    s += `<line x1="${X(50)}" y1="${Y(4)}" x2="${X(50)}" y2="${Y(30)}" stroke="${fill}" stroke-width="2"/>`;
    return s;
  }
  if (kind === 'slep') {
    s += `<polygon points="${P([[50, 6], [96, 8], [90, -3], [54, -3]])}" fill="${fill}"/>`;
    s += `<rect x="${Math.min(X(64), X(80))}" y="${Y(16)}" width="${Math.abs(X(80) - X(64))}" height="${Y(6) - Y(16)}" fill="${fill}"/>`;
    s += `<line x1="${X(72)}" y1="${Y(16)}" x2="${X(72)}" y2="${Y(52)}" stroke="${fill}" stroke-width="2"/>`;
    s += `<line x1="${X(60)}" y1="${Y(6)}" x2="${X(60)}" y2="${Y(56)}" stroke="${fill}" stroke-width="2"/>`;
    if (flip) s += `<line x1="${X(50)}" y1="${Y(4)}" x2="${W}" y2="${Y(0)}" stroke="${fill}" stroke-width="1.5"/>`;
    else s += `<line x1="${X(50)}" y1="${Y(4)}" x2="0" y2="${Y(0)}" stroke="${fill}" stroke-width="1.5"/>`;
    return s;
  }
  if (kind === 'fisk') {
    s += `<polygon points="${P([[2, 8], [98, 12], [90, -3], [6, -3]])}" fill="${fill}"/>`;
    s += `<rect x="${Math.min(X(70), X(88))}" y="${Y(22)}" width="${Math.abs(X(88) - X(70))}" height="${Y(9) - Y(22)}" fill="${fill}"/>`;
    s += `<line x1="${X(66)}" y1="${Y(10)}" x2="${X(66)}" y2="${Y(50)}" stroke="${fill}" stroke-width="2"/>`;
    s += `<line x1="${X(16)}" y1="${Y(8)}" x2="${X(16)}" y2="${Y(30)}" stroke="${fill}" stroke-width="2"/>`;
    return s;
  }
  // standard skip
  s += `<polygon points="${P([[0, 10], [100, 12], [94, -3], [3, -3]])}" fill="${fill}"/>`;
  s += `<rect x="${Math.min(X(4), X(22))}" y="${Y(26)}" width="${Math.abs(X(22) - X(4))}" height="${Y(10) - Y(26)}" fill="${fill}"/>`;
  s += `<line x1="${X(84)}" y1="${Y(11)}" x2="${X(84)}" y2="${Y(38)}" stroke="${fill}" stroke-width="2"/>`;
  s += `<line x1="${X(56)}" y1="${Y(11)}" x2="${X(56)}" y2="${Y(54)}" stroke="${fill}" stroke-width="2"/>`;
  s += `<line x1="${X(92)}" y1="${Y(11)}" x2="${X(92)}" y2="${Y(24)}" stroke="${fill}" stroke-width="2"/>`;
  return s;
}
function hullAhead() {
  const fill = '#3a4a55', Y = h => HZ - h * SCALE, c = W / 2;
  return `<polygon points="${c - 44},${Y(12)} ${c + 44},${Y(12)} ${c + 30},${Y(-3)} ${c - 30},${Y(-3)}" fill="${fill}"/>` +
    `<rect x="${c - 36}" y="${Y(26)}" width="72" height="${Y(12) - Y(26)}" fill="${fill}"/>` +
    `<line x1="${c}" y1="${Y(26)}" x2="${c}" y2="${Y(54)}" stroke="${fill}" stroke-width="2.5"/>` +
    `<line x1="${c - 62}" y1="${Y(37)}" x2="${c + 62}" y2="${Y(37)}" stroke="${fill}" stroke-width="2"/>`;
}
function shapeSVG(s, view) {
  const p = toScreen(s, view), x = p.x, y = p.y, r = 9, k = '#111';
  switch (s.s) {
    case 'kule': return `<circle cx="${x}" cy="${y}" r="${r}" fill="${k}"/>`;
    case 'kjegleOpp': return `<polygon points="${x},${y - r} ${x + r},${y + r} ${x - r},${y + r}" fill="${k}"/>`;
    case 'kjegleNed': return `<polygon points="${x - r},${y - r} ${x + r},${y - r} ${x},${y + r}" fill="${k}"/>`;
    case 'diamant': return `<polygon points="${x},${y - r * 1.4} ${x + r},${y} ${x},${y + r * 1.4} ${x - r},${y}" fill="${k}"/>`;
    case 'sylinder': return `<rect x="${x - r}" y="${y - r * 2}" width="${r * 2}" height="${r * 4}" fill="${k}"/>`;
    case 'flaggA': { // internasjonalt signalflagg A: hvit ved stangen, blå med svalehale
      const flip = view === 'babord' ? -1 : 1, w = 30, h = 20, x0 = x, y0 = y - h;
      const X = d => x0 + flip * d;
      return `<rect x="${Math.min(X(0), X(w / 2))}" y="${y0}" width="${w / 2}" height="${h}" fill="#fff" stroke="#111" stroke-width=".8"/>` +
        `<polygon points="${X(w / 2)},${y0} ${X(w)},${y0} ${X(w * 0.72)},${y0 + h / 2} ${X(w)},${y0 + h} ${X(w / 2)},${y0 + h}" fill="#1f4fa8" stroke="#111" stroke-width=".8"/>`;
    }
  }
  return '';
}
const COLORS = { w: '#fff8e6', r: '#ff3b2f', g: '#2ff56c', y: '#ffc400' };
function sceneSVG(sc, view, label) {
  const night = sc.mode === 'natt';
  let s = `<svg class="scene" viewBox="0 0 ${W} 250" role="img" aria-label="${label}" xmlns="${NS}">`;
  s += `<defs><linearGradient id="sky${night ? 'N' : 'D'}" x1="0" y1="0" x2="0" y2="1">` +
    (night ? `<stop offset="0" stop-color="#02060b"/><stop offset="1" stop-color="#0b1a28"/>` : `<stop offset="0" stop-color="#9cc7e4"/><stop offset="1" stop-color="#dcecf5"/>`) +
    `</linearGradient><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.2"/></filter></defs>`;
  s += `<rect width="${W}" height="250" fill="url(#sky${night ? 'N' : 'D'})"/>`;
  s += `<rect y="${HZ}" width="${W}" height="${250 - HZ}" fill="${night ? '#050d14' : '#4f7f99'}"/>`;
  if (night) {
    // Ingen skrog om natten: bare lanterner (slik det ser ut i virkeligheten)
    sc.el.filter(e => visible(e, view)).forEach(e => {
      const p = toScreen(e, view), col = COLORS[e.c], cls = e.blink ? ' class="blink"' : '';
      s += `<g${cls}><circle cx="${p.x}" cy="${p.y}" r="8" fill="${col}" opacity=".55" filter="url(#glow)"/><circle cx="${p.x}" cy="${p.y}" r="4" fill="${col}"/></g>`;
    });
  } else {
    s += view === 'forfra' ? hullAhead() : hullProfile(sc.hull || 'skip', view, true);
    sc.sh.forEach(sh => { s += shapeSVG(sh, view); });
  }
  return s + '</svg>';
}

/* ---------- Spillet ---------- */
const N = 10;
if (typeof document !== 'undefined') (function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ingen lagring */ } }
  };
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : (params.get('lang') === 'nb' ? 'nb' : (store.get('cphd-lang') || 'nb'));
  let mode = 'natt';
  const bank = buildBank().ok;
  let round = null, timer = null;

  function t(k) { return T[lang][k]; }
  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'nb';
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
    document.title = `${t('title')} · Captain PhD`;
    $('lang').textContent = t('langBtn');
    const home = document.querySelector('.home'); home.href = lang === 'en' ? home.dataset.hrefEn : home.dataset.hrefNb;
    showBest();
    if (round && !$('play').hidden) renderQ(true);
    if (round && !$('result').hidden) showResult();
  }
  $('lang').addEventListener('click', () => { lang = lang === 'nb' ? 'en' : 'nb'; store.set('cphd-lang', lang); applyLang(); });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    showBest();
  }));

  function showBest() {
    const b = store.get('cphd-lanterner-best-' + mode);
    $('best').textContent = b ? t('best')(b, T[lang].modeName[mode]) : '';
  }

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function pickQuestions() {
    const pool = bank.filter(q => mode === 'blandet' || q.mode === mode);
    // Ikke samme svar to ganger på rad i en runde hvis det kan unngås
    const byA = {};
    pool.forEach(q => { (byA[q.a] = byA[q.a] || []).push(q); });
    const answers = shuffle(Object.keys(byA));
    const out = [];
    let k = 0;
    while (out.length < N) { const list = byA[answers[k % answers.length]]; out.push(list[Math.floor(Math.random() * list.length)]); k++; }
    return shuffle(out).map(q => {
      const sameMode = [...new Set(bank.filter(b => b.mode === q.mode).map(b => b.a))].filter(a => a !== q.a);
      // Velg feilsvar som ligner (samme farger/figurer), så spørsmålet blir en ekte øvelse
      const mine = tokens(SC[q.i]);
      const ranked = shuffle(sameMode).map(a => ({ a, s: likeness(mine, answerTokens(a, q.mode)) })).sort((x, y) => y.s - x.s);
      const pickFrom = ranked.slice(0, 5).map(r => r.a);
      return { ...q, opts: shuffle([q.a, ...shuffle(pickFrom).slice(0, 3)]) };
    });
  }

  function start() {
    round = { qs: pickQuestions(), n: 0, correct: 0, pts: 0, t0: Date.now(), wrong: [], answered: false };
    $('start').hidden = true; $('result').hidden = true; $('play').hidden = false;
    clearInterval(timer);
    timer = setInterval(() => { $('clock').textContent = fmt(Date.now() - round.t0); }, 500);
    renderQ();
  }
  const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function renderQ(keepState) {
    const q = round.qs[round.n], sc = SC[q.i];
    $('count').textContent = t('count')(round.n + 1, N);
    $('score').textContent = t('score')(round.pts);
    $('sceneBox').innerHTML = sceneSVG(sc, q.v, t('sceneLabel'));
    $('question').textContent = sc.mode === 'natt' ? t('qNight') : t('qDay');
    const box = $('opts'); box.innerHTML = '';
    q.opts.forEach((a, idx) => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.a = a;
      b.innerHTML = `<kbd>${idx + 1}</kbd><span>${A[a][lang]}</span>`;
      b.addEventListener('click', () => answer(a));
      box.appendChild(b);
    });
    if (keepState && round.answered) { markAnswer(round.lastPick); return; }
    round.answered = false; round.qStart = Date.now();
    $('explain').hidden = true; $('next').hidden = true;
    const first = box.querySelector('button'); if (first && !keepState) first.focus({ preventScroll: true });
  }

  function answer(a) {
    if (round.answered) return;
    round.answered = true; round.lastPick = a;
    const q = round.qs[round.n];
    if (a === q.a) {
      round.correct++;
      const secs = (Date.now() - round.qStart) / 1000;
      round.pts += 100 + Math.max(0, Math.round(50 - secs * 5)); // raskt svar gir bonus
    } else round.wrong.push(q);
    markAnswer(a);
  }

  function markAnswer(a) {
    const q = round.qs[round.n], sc = SC[q.i], ok = a === q.a;
    document.querySelectorAll('#opts button').forEach(b => {
      b.disabled = true;
      if (b.dataset.a === q.a) b.classList.add('right');
      else if (b.dataset.a === a) b.classList.add('wrong');
    });
    const ans = A[q.a];
    const seen = sc.mode === 'natt' ? ' ' + t('seenFrom')[q.v] : '';
    $('explain').innerHTML = `<b class="${ok ? 'ok' : 'bad'}">${ok ? t('right') : t('wrong')}</b> ` +
      (ok ? '' : `${t('answerWas')} <b>${ans[lang]}</b>. `) + (lang === 'en' ? ans.xen : ans.xnb) + seen +
      ` <span style="color:var(--muted)">(${ans.ref})</span>`;
    $('explain').hidden = false;
    $('score').textContent = t('score')(round.pts);
    const last = round.n === N - 1;
    $('next').textContent = last ? t('finish') : t('next');
    $('next').hidden = false; $('next').focus({ preventScroll: true });
  }

  $('next').addEventListener('click', () => {
    if (round.n === N - 1) { finish(); return; }
    round.n++; renderQ();
    $('play').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });

  function finish() {
    clearInterval(timer);
    round.time = Date.now() - round.t0;
    const key = 'cphd-lanterner-best-' + mode, best = +(store.get(key) || 0);
    if (round.pts > best) store.set(key, String(round.pts));
    showResult();
  }
  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    $('resTitle').textContent = t('resTitle')(round.correct, N);
    $('resText').textContent = t('resText')(fmt(round.time), round.pts);
    if (!round.wrong.length) { $('resReview').innerHTML = `<p>${t('perfect')}</p>`; }
    else {
      const seen = new Set();
      const items = round.wrong.filter(q => !seen.has(q.a) && seen.add(q.a)).map(q => {
        const a = A[q.a];
        return `<li><b>${a[lang]}</b>: ${lang === 'en' ? a.xen : a.xnb} <span style="color:var(--muted)">(${a.ref})</span></li>`;
      }).join('');
      $('resReview').innerHTML = `<p><b>${t('reviewTitle')}</b></p><ul class="review">${items}</ul>`;
    }
    showBest();
    $('again').focus({ preventScroll: true });
  }

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', () => { $('result').hidden = true; $('start').hidden = false; round = null; showBest(); });

  document.addEventListener('keydown', e => {
    if ($('play').hidden || !round) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !round.answered) { const q = round.qs[round.n]; if (q.opts[n - 1]) answer(q.opts[n - 1]); }
  });

  applyLang();
})();

if (typeof module !== 'undefined') module.exports = { SC, A, buildBank, signature, visible, sceneSVG };
</script>
