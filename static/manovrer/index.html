<script>
'use strict';
/* ==========================================================================
   Manøver — Captain PhD
   Kilde/Source: Marfag K52 Lærebok sjøveisreglene (regel 8 s. 83–84; regel 13 s. 122;
   regel 15 s. 130; regel 16 s. 142; regel 17 s. 143; regel 19 s. 158; regel 34 s. 216–217),
   CC BY-SA 3.0; tilpasset/adapted. Faktatabell: captainphd-prosjektet, k52-manovrer-faktatabell.md
   Bare regelteksten brukes som fasit. Lærebokens egne tommelfingerregler (avstander i nm,
   antall grader) er ikke med i poenggivende spørsmål.
   ========================================================================== */

const T = {
  nb: {
    title: 'Manøver',
    lede: 'Hva skal du gjøre når du må vike, og når du skal holde kurs og fart? Sjøveisreglene regel 8, 15, 16, 17 og 34: tidlig og tydelig manøver, forholdsregler for fartøyet som holder kurs, og fløytesignaler. 10 spørsmål.',

    mRul: 'Regler', mRulSub: 'Regel 8, 15–17, 19',
    mMix: 'Blandet', mMixSub: 'Alt',
    note: 'Her handler det om hva du gjør, ikke bare hvem som skal vike (det øver du i «Hvem viker?»). Fasit er regelteksten. Bare de internasjonale reglene gjelder her, ikke de norske særreglene.',
    start: 'Start', again: 'Spill igjen', next: 'Neste', finish: 'Se resultat',
    right: 'Riktig!', wrong: 'Feil.', answerWas: 'Riktig svar:',
    count: (i, n) => `Spørsmål ${i}/${n}`, score: s => `${s} poeng`,
    resTitle: (c, n) => `${c} av ${n} riktige`,
    resText: (time, pts) => `Tid: ${time}. Poeng: ${pts}.`,
    best: (pts, mode) => `Din beste poengsum (${mode}): ${pts}`,
    reviewTitle: 'Dette bør du lese en gang til:',
    perfect: 'Alt riktig. Godt sjømannskap!',
    you: 'Du', other: 'Den andre', kn: 'kn',
    sceneAlt: 'Tegning av to fartøy sett ovenfra', blastAlt: 'Fløytesignal tegnet som korte støt', blastWord: 'korte støt', blastRapid: 'korte og raske støt',
    solution: 'Grønn linje: en god manøver. Blasse fartøy: situasjonen når dere er nærmest hverandre (tegnet for dette spillet).', cpa: 'Nærmest:',
    disclaimer: 'Spillet er laget for læring og erstatter ikke offisiell eksamen eller opplæring.',
    source: 'Kilde: Marfag K52 Lærebok sjøveisreglene, CC BY-SA 3.0; tilpasset. Tegningene er laget for dette spillet.',
    licence: 'Spørsmål, tekster og tegninger i spillet deles under <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.no" rel="license">CC BY-SA 3.0</a>. Fant du en feil? Gi beskjed via <a href="https://github.com/sevketirtem/captainphd/issues">GitHub</a>.',
    modeName: { vik: 'jeg skal vike', hold: 'jeg holder kurs', sig: 'fløytesignaler', regler: 'regler', blandet: 'blandet' },
    langBtn: 'English'
  },
  en: {
    title: 'Manoeuvres',
    lede: 'What do you do when you must give way, and when you must hold course and speed? Collision regulations rules 8, 15, 16, 17 and 34: early and substantial action, what the stand-on vessel may do, and whistle signals. 10 questions.',
    chooseMode: 'Choose a mode',
    mGive: 'I give way', mGiveSub: 'Rules 8, 15, 16',
    mStand: 'I stand on', mStandSub: 'Rule 17',
    mSig: 'Whistle signals', mSigSub: 'Rule 34',
    mRul: 'Rules', mRulSub: 'Rules 8, 15–17, 19',
    mMix: 'Mixed', mMixSub: 'Everything',
    note: 'This is about what you do, not only who gives way (practise that in “Who gives way?”). The answer key is the text of the rules. Only the international rules apply here, not the Norwegian special rules.',
    start: 'Start', again: 'Play again', next: 'Next', finish: 'See result',
    right: 'Correct!', wrong: 'Wrong.', answerWas: 'Correct answer:',
    count: (i, n) => `Question ${i}/${n}`, score: s => `${s} points`,
    resTitle: (c, n) => `${c} of ${n} correct`,
    resText: (time, pts) => `Time: ${time}. Points: ${pts}.`,
    best: (pts, mode) => `Your best score (${mode}): ${pts}`,
    reviewTitle: 'Worth reading once more:',
    perfect: 'All correct. Good seamanship!',
    you: 'You', other: 'The other', kn: 'kn',
    sceneAlt: 'Drawing of two vessels seen from above', blastAlt: 'Whistle signal drawn as short blasts', blastWord: 'short blasts', blastRapid: 'short and rapid blasts',
    solution: 'Green line: a good manoeuvre. Faded vessels: the situation at closest approach (drawn for this game).', cpa: 'Closest:',
    disclaimer: 'This game is made for learning and does not replace official examinations or training.',
    source: 'Source: Marfag K52 Lærebok sjøveisreglene, CC BY-SA 3.0; adapted. The drawings were made for this game.',
    licence: 'Questions, texts and drawings in this game are shared under <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="license">CC BY-SA 3.0</a>. Found a mistake? Tell us on <a href="https://github.com/sevketirtem/captainphd/issues">GitHub</a>.',
    modeName: { vik: 'I give way', hold: 'I stand on', sig: 'whistle signals', regler: 'rules', blandet: 'mixed' },
    langBtn: 'Norsk'
  }
};
const N = 10;

/* ---------- Geometri (eget fartøy i origo, kurs 0; x = styrbord, y = forover; enhet nm) ---------- */
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const norm = a => ((a % 360) + 360) % 360;
const near = a => Math.min(norm(a), 360 - norm(a));
function brg(from, to, heading) { return norm(deg(Math.atan2(to.x - from.x, to.y - from.y)) - heading); }
const inStern = a => a > 112.5 && a < 247.5; // mer enn 22,5° akterlig for tvers (regel 13 b)
function classify(own, tgt) {
  const b = brg(own, tgt, own.h), b2 = brg(tgt, own, tgt.h);
  if (inStern(b)) return { rule: 'r13', role: 'stand', b, b2 };
  if (inStern(b2)) return { rule: 'r13', role: 'give', b, b2 };
  const dh = near(tgt.h - own.h - 180);
  if (near(b) <= 5 && near(b2) <= 5 && dh <= 5) return { rule: 'r14', role: 'both', b, b2 };
  return { rule: 'r15', role: b < 180 ? 'give' : 'stand', b, b2 };
}
const margin = c => Math.min(Math.abs(c.b - 112.5), Math.abs(c.b - 247.5), Math.abs(c.b2 - 112.5), Math.abs(c.b2 - 247.5));

/* Simulering: egen bane (rett fram, så kursendring) mot målets rette bane. Brukes i testen. */
function simulate(sc, turn, tTurnNm, kn) {
  const v = kn || sc.own.kn, th = rad(sc.tgt.h), tk = sc.tgt.kn;
  let min = 1e9, tmin = 0;
  const tt = tTurnNm / v;
  for (let t = 0; t < 1.2; t += 0.001) {
    const own = t <= tt ? { x: 0, y: v * t } : { x: v * (t - tt) * Math.sin(rad(turn)), y: v * tt + v * (t - tt) * Math.cos(rad(turn)) };
    const tg = { x: sc.tgt.x + tk * t * Math.sin(th), y: sc.tgt.y + tk * t * Math.cos(th) };
    const d = Math.hypot(own.x - tg.x, own.y - tg.y);
    if (d < min) { min = d; tmin = t; }
  }
  return { cpa: min, tmin };
}

/* ---------- Situasjoner ---------- */
const GIVE = [], STAND = [], OVER = [], OVERT = [];
(function () {
  const OWN = kn => ({ x: 0, y: 0, h: 0, kn });
  const P = { x: 0, y: 5 };
  [['stb', 1], ['bb', -1]].forEach(([side, s]) => {
    [35, 50, 65, 80].forEach(beta => [6, 7.5].forEach(r => {
      const T0 = { x: s * r * Math.sin(rad(beta)), y: r * Math.cos(rad(beta)) };
      const q = Math.hypot(T0.x - P.x, T0.y - P.y);
      if (q < 3 || q > 8.2) return;
      const kn = Math.round(12 * q / 5);
      const sc = { kind: 'cross', side, own: OWN(12), tgt: { ...T0, h: norm(deg(Math.atan2(P.x - T0.x, P.y - T0.y))), kn }, P };
      const c = classify(sc.own, sc.tgt);
      if (c.rule === 'r15' && margin(c) >= 15 && kn >= 6 && kn <= 20) {
        sc.exp = { rule: c.rule, role: c.role };
        if (side === 'stb' && c.role === 'give') GIVE.push(sc);
        if (side === 'bb' && c.role === 'stand') STAND.push(sc);
      }
    }));
  });
  [4, 5.5].forEach(y => [-0.5, 0.5].forEach(x => {
    const a = { kind: 'over', own: OWN(14), tgt: { x, y, h: 0, kn: 9 } };
    const b = { kind: 'overt', own: OWN(9), tgt: { x, y: -y, h: 0, kn: 15 } };
    [a, b].forEach(sc => {
      const c = classify(sc.own, sc.tgt); sc.exp = { rule: c.rule, role: c.role };
      if (c.rule === 'r13' && margin(c) >= 15) (sc.kind === 'over' ? OVER : OVERT).push(sc);
    });
  }));
})();
/* God manøver (grønn linje): tidlig, stor kursendring til styrbord etter 1,5 nm; forbikjøring: tidlig, stor sidebevegelse */
const TURN = 60, TURN_AT = 1.5;
function goodTrack(sc) {
  if (sc.kind === 'cross') {
    return [{ x: 0, y: 0 }, { x: 0, y: TURN_AT }, { x: 4 * Math.sin(rad(TURN)), y: TURN_AT + 4 * Math.cos(rad(TURN)) }];
  }
  const side = sc.tgt.x >= 0 ? -1 : 1;
  return [{ x: 0, y: 0 }, { x: side * 1.4, y: 1.4 }, { x: side * 1.4, y: sc.tgt.y + 5 }];
}

/* Posisjoner ved nærmeste passering (CPA) når du følger den grønne linjen */
function ghostFor(sc) {
  const v = sc.own.kn, tt = TURN_AT / v, r = simulate(sc, TURN, TURN_AT), t = r.tmin, d2 = v * (t - tt);
  const own = t <= tt ? { x: 0, y: v * t } : { x: d2 * Math.sin(rad(TURN)), y: TURN_AT + d2 * Math.cos(rad(TURN)) };
  const th = rad(sc.tgt.h);
  return { own: { ...own, h: t <= tt ? 0 : TURN, kn: v }, tgt: { x: sc.tgt.x + sc.tgt.kn * t * Math.sin(th), y: sc.tgt.y + sc.tgt.kn * t * Math.cos(th), h: sc.tgt.h, kn: sc.tgt.kn }, cpa: r.cpa };
}

/* ---------- Tegning (SVG) ---------- */
function shipSVG(p, own, kn, label, kt) {
  const col = own ? 'var(--sea)' : 'var(--amber)';
  return `<g transform="translate(${p.sx.toFixed(1)} ${p.sy.toFixed(1)}) rotate(${p.h.toFixed(1)})">` +
    `<path d="M0 -14 L6.5 -5 L6.5 11 L-6.5 11 L-6.5 -5 Z" fill="${col}" stroke="var(--fg)" stroke-width="${own ? 2 : 1.2}" stroke-linejoin="round"/></g>` +
    `<text x="${(p.sx + 12).toFixed(1)}" y="${(p.sy - 12).toFixed(1)}" font-size="12" font-weight="700" fill="var(--fg)">${label}</text>` +
    `<text x="${(p.sx + 12).toFixed(1)}" y="${(p.sy + 2).toFixed(1)}" font-size="11" fill="var(--muted)">${kn} ${kt}</text>`;
}
function arrowSVG(a, b, dash) {
  const ang = Math.atan2(b.sx - a.sx, -(b.sy - a.sy)), ux = Math.sin(ang), uy = -Math.cos(ang);
  const hx = b.sx, hy = b.sy, l = 8, w = 4;
  const p1 = [hx - ux * l + uy * w, hy - uy * l - ux * w], p2 = [hx - ux * l - uy * w, hy - uy * l + ux * w];
  return `<line x1="${a.sx.toFixed(1)}" y1="${a.sy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--fg)" stroke-width="1.6"${dash ? ' stroke-dasharray="5 4"' : ''} opacity=".7"/>` +
    `<polygon points="${hx.toFixed(1)},${hy.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="var(--fg)" opacity=".7"/>`;
}
/* sc: { own, tgt, P? }, track: valgfri løsningslinje i nm */
function sceneSVG(sc, tx, track, ghost) {
  const W = 340, H = 250;
  const arrLen = kn => Math.max(1.6, kn * 0.2);
  const dirv = h => ({ x: Math.sin(rad(h)), y: Math.cos(rad(h)) });
  const O = sc.own, Tg = sc.tgt;
  const endOf = s => sc.P && sc.kind === 'cross' ? sc.P : { x: s.x + dirv(s.h).x * arrLen(s.kn), y: s.y + dirv(s.h).y * arrLen(s.kn) };
  const pts = [O, Tg, endOf(O), endOf(Tg)].concat(track || []).concat(ghost ? [ghost.own, ghost.tgt] : []);

}
const FIDX = g => FACTS.map((f, i) => i).filter(i => g.includes(FACTS[i].g));

function typesFor(mode) {
  if (mode === 'vik') return shuffle(['give', 'give', 'give', 'give', 'over', 'over', 'fg', 'fg', 'fg', 'fg']);
  if (mode === 'hold') return shuffle(STAND_V.map(v => 'st:' + v).concat(['fs', 'fs', 'fs']));
  if (mode === 'sig') return shuffle(['sd', 'sd', 'sd', 'sd', 'sw', 'sw', 'sw', 'sw', 'fsig', 'fsig']);
  if (mode === 'regler') return Array(N).fill('fall');
  return shuffle(['give', 'give', 'over', 'st', 'st', 'sd', 'sw', 'fg', 'fs', 'fv']);
}
function makeRound(mode) {
  const giveI = cycle(GIVE.map((s, i) => i)), overI = cycle(OVER.map((s, i) => i));
  const stV = cycle(STAND_V), sigK = cycle(['stb', 'bb', 'ast', 'doubt']);
  const fg = cycle(FIDX(['g'])), fs = cycle(FIDX(['s'])), fv = cycle(FIDX(['v'])), fsig = cycle(FIDX(['sig'])), fall = cycle(FIDX(['g', 's', 'v', 'sig']));
  const out = [], used = new Set();
  typesFor(mode).forEach(t => {
    for (let tries = 0; tries < 40; tries++) {
      let q;
      if (t === 'give') q = giveQuestion(giveI());
      else if (t === 'over') q = overQuestion(overI());
      else if (t === 'st') q = standQuestion(stV());
      else if (t.startsWith('st:')) q = standQuestion(t.slice(3));
      else if (t === 'sd') q = sigQuestion(sigK(), 'draw');
      else if (t === 'sw') q = sigQuestion(sigK(), 'word');
      else if (t === 'fg') q = factQuestion(fg());
      else if (t === 'fs') q = factQuestion(fs());
      else if (t === 'fv') q = factQuestion(fv());
      else if (t === 'fsig') q = factQuestion(fsig());
      else q = factQuestion(fall());
      if (!used.has(q.pool) || tries === 39) { used.add(q.pool); out.push(q); break; }
    }
  });
  return out;
}

      const a = document.createElement('a'); a.className = 'card' + (k === 0 ? ' next' : '');
      a.href = '/' + g.s + '/' + (nb ? '' : '?lang=en');
      const b = document.createElement('b'); b.textContent = nb ? g.nb : g.en; a.appendChild(b);
      const sp = document.createElement('span'); sp.textContent = nb ? g.rnb : g.ren; a.appendChild(sp);
      cards.appendChild(a);
    });
    const home = document.createElement('a'); home.className = 'home';
    home.href = nb ? '/' : '/en/'; home.textContent = nb ? 'Til forsiden' : 'Home';
    box.appendChild(home);
  }
  /* MORE-END */

  function renderShare() {
    const box = $('share'); if (!box) return;
    const nb = lang !== 'en';
    const title = t('title');
    const url = SHARE_URL + (nb ? '' : '?lang=en');
    const text = nb ? `Jeg fikk ${round.pts} poeng i «${title}» på captainphd.com` : `I scored ${round.pts} points in “${title}” on captainphd.com`;
    const L = nb ? { h: 'Del resultatet', share: 'Del …', copy: 'Kopier lenke', copied: 'Kopiert!' } : { h: 'Share result', share: 'Share …', copy: 'Copy link', copied: 'Copied!' };
    const enc = encodeURIComponent;
    box.innerHTML = ''; box.className = 'share';
    const h = document.createElement('h3'); h.textContent = L.h; box.appendChild(h);
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    if (typeof navigator !== 'undefined' && navigator.share) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'main'; b.textContent = L.share;
      b.addEventListener('click', () => { navigator.share({ title, text, url }).catch(() => {}); });
      row.appendChild(b);
    } else {
      [['WhatsApp', 'https://wa.me/?text=' + enc(text + ' ' + url)],
       ['X', 'https://x.com/intent/post?text=' + enc(text) + '&url=' + enc(url)],
       ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url)]].forEach(([n, href]) => {
        const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = n; row.appendChild(a);
      });
    }
    const c = document.createElement('button'); c.type = 'button'; c.textContent = L.copy;
    c.addEventListener('click', () => {
      const done = () => { c.textContent = L.copied; setTimeout(() => { c.textContent = L.copy; }, 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
      else { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ingen */ } document.body.removeChild(ta); done(); }
    });
    row.appendChild(c);
  }

  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    $('resTitle').textContent = t('resTitle')(round.correct, N);
    $('resText').textContent = t('resText')(fmt(round.time), round.pts);
    if (!round.wrong.length) { $('resReview').innerHTML = `<p>${t('perfect')}</p>`; }
    else {
      const seen = new Set();
      const items = round.wrong.filter(q => { const k = q.ref + q.x.nb; return !seen.has(k) && seen.add(k); })
        .map(q => `<li><b>${q.stem[lang].length > 150 ? q.stem[lang].slice(0, 147) + '…' : q.stem[lang]}</b> ${q.x[lang]} <span style="color:var(--muted)">(${q.ref})</span></li>`).join('');
      $('resReview').innerHTML = `<p><b>${t('reviewTitle')}</b></p><ul class="review">${items}</ul>`;
    }
    showBest();
    renderShare();
    renderMore();
    $('again').focus({ preventScroll: true });
  }

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', () => { $('result').hidden = true; $('start').hidden = false; round = null; showBest(); });

  document.addEventListener('keydown', e => {
    if ($('play').hidden || !round || e.ctrlKey || e.metaKey || e.altKey) return;
    const q = round.qs[round.n];
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !round.answered && q.opts[n - 1]) answer(q.opts[n - 1].id);
  });

  applyLang();
})();

if (typeof module !== 'undefined') module.exports = { GIVE, STAND, OVER, OVERT, FACTS, STAND_V, SIG_N, makeRound, giveQuestion, overQuestion, standQuestion, sigQuestion, goodTrack, ghostFor, simulate, classify, margin, sceneSVG, blastSVG, N, T };
</script>
