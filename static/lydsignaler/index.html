/* ---------- Signalmønstre ----------
   s = kort støt (ca. 1 s), l = langt støt (4–6 s), f = kort støt raskt (regel 34 d),
   b = ett slag på klokken, r = rask klokkeringing ca. 5 s, R = rask gongong ca. 5 s */
const EV = {
  s: { k: 'w', d: 1,   gap: 1 },
  l: { k: 'w', d: 5,   gap: 2 },
  f: { k: 'w', d: 0.25, gap: 0.25 },
  b: { k: 'b', d: 0.2, gap: 1 },
  r: { k: 'r', d: 5,   gap: 0.5 },
  R: { k: 'g', d: 5,   gap: 0.5 }
};
function schedule(pat, speed) {
  const out = []; let t = 0;
  [...pat].forEach((ch, i) => {
    const e = EV[ch];
    out.push({ i, ch, k: e.k, t0: t * speed, d: e.d * speed });
    t += e.d + e.gap;
  });
  return { ev: out, total: t * speed };
}

/* ---------- Spørsmålsbank ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function cycle(pool) { let q = []; return () => { if (!q.length) q = shuffle(pool.slice()); return q.pop(); }; }
function answerOpts(key, fam) {
  const others = shuffle(Object.keys(A).filter(k => A[k].fam === fam && k !== key)).slice(0, 3);
  return shuffle([key, ...others]).map(k => ({ id: k, nb: A[k].nb, en: A[k].en }));
}
function factOpts(f, i) {
  return shuffle(f.o.map((o, j) => ({ id: 'f' + i + '_' + j, nb: o[0], en: o[1], ok: j === 0 })));
}
function typesFor(mode) {
  if (mode === 'signal') return Array(N).fill('hear');
  if (mode === 'tåke') return Array(N).fill('fog');
  if (mode === 'bygg') return Array(N).fill('build');
  if (mode === 'fakta') return Array(N).fill('fact');
  if (mode === 'norge') return Array(N).fill('nor');
  return shuffle(['hear', 'hear', 'hear', 'fog', 'fog', 'fog', 'build', 'build', 'fact', 'fact']);
}
function makeRound(mode) {
  const draw = {
    hear: cycle(HEAR), fog: cycle(FOG), build: cycle(BUILD),
    fact: cycle(FACTS.map((f, i) => i).filter(i => FACTS[i].g === 'int')),
    nor: cycle(FACTS.map((f, i) => i).filter(i => FACTS[i].g === 'nor'))
  };
  return typesFor(mode).map(type => {
    if (type === 'hear') { const a = draw.hear(); return { type, a, opts: answerOpts(a, 'man') }; }
    if (type === 'fog') { const a = draw.fog(); return { type, a, opts: answerOpts(a, 'fog') }; }
    if (type === 'build') { const a = draw.build(); return { type, a }; }
    const i = type === 'fact' ? draw.fact() : draw.nor();
    return { type: 'fact', f: i, opts: factOpts(FACTS[i], i) };
  });
}

/* ---------- Tegning av signalmønster ---------- */
function patSVG(pat, label, activeIdx) {
  const W = { s: 16, l: 64, f: 7, b: 12, r: 70, R: 60 };
  let x = 8, parts = '';
  [...pat].forEach((ch, i) => {
    const on = i === activeIdx ? ' on' : '';
    if (ch === 's' || ch === 'l' || ch === 'f') {
      parts += `<rect class="ev${on}" data-i="${i}" x="${x}" y="14" width="${W[ch]}" height="20" rx="3"/>`;
    } else if (ch === 'b') {
      parts += `<circle class="ev bell${on}" data-i="${i}" cx="${x + 6}" cy="24" r="6"/>`;
    } else if (ch === 'r') {
      let c = ''; for (let k = 0; k < 8; k++) c += `<circle cx="${x + 5 + k * 8.5}" cy="24" r="3.6"/>`;
      parts += `<g class="ev bell${on}" data-i="${i}">${c}</g>`;
    } else if (ch === 'R') {
      let c = ''; for (let k = 0; k < 5; k++) c += `<rect x="${x + k * 12}" y="17" width="9" height="14" rx="2"/>`;
      parts += `<g class="ev bell${on}" data-i="${i}">${c}</g>`;
    }
    x += W[ch] + (ch === 'f' ? 5 : ch === 'b' ? 8 : 12);
  });
  const w = Math.max(x + 4, 120);
  return `<svg viewBox="0 0 ${w} 48" preserveAspectRatio="xMinYMid meet" role="img" aria-label="${label}">${parts}</svg>`;
}
function patText(pat, names) {
  return [...pat].map(c => names[c]).join(', ');
}

    $('explain').innerHTML = `<b class="${ok ? 'ok' : 'bad'}">${ok ? t('right') : t('wrong')}</b> ${head}${body} <span style="color:var(--muted)">(${ref})</span>`;
    $('explain').hidden = false;
    $('score').textContent = t('score')(round.pts);

  }

    return `<li><b>${a[lang]}</b>: ${patText(a.pat, T[lang].patNames)}. ${lang === 'en' ? a.xen : a.xnb} <span style="color:var(--muted)">(${a.ref})</span></li>`;
  }

  const SHARE_URL = 'https://captainphd.com/lydsignaler/';

    { s: 'lanterner', nb: 'Lanterner og dagsignaler', en: 'Lights and shapes', rnb: 'Regel 20–31', ren: 'Rules 20–31' },
    { s: 'hvem-viker', nb: 'Hvem viker?', en: 'Who gives way?', rnb: 'Regel 11–19', ren: 'Rules 11–19' },

    const box = $('more'); if (!box) return;
    const nb = lang !== 'en';

      const a = document.createElement('a'); a.className = 'card' + (k === 0 ? ' next' : '');
      a.href = '/' + g.s + '/' + (nb ? '' : '?lang=en');

  function renderShare() {
    const box = $('share'); if (!box) return;
    const nb = lang !== 'en';
    const title = t('title');
    const url = SHARE_URL + (nb ? '' : '?lang=en');
    const text = nb ? `Jeg fikk ${round.pts} poeng i «${title}» på captainphd.com` : `I scored ${round.pts} points in “${title}” on captainphd.com`;
    const L = nb ? { h: 'Del resultatet', share: 'Del …', copy: 'Kopier lenke', copied: 'Kopiert!' } : { h: 'Share result', share: 'Share …', copy: 'Copy link', copied: 'Copied!' };
    const enc = encodeURIComponent;
    box.innerHTML = ''; box.className = 'share';
    const h = document.createElement('h3'); h.textContent = L.h; box.appendChild(h);
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    if (typeof navigator !== 'undefined' && navigator.share) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'main'; b.textContent = L.share;
      b.addEventListener('click', () => { navigator.share({ title, text, url }).catch(() => {}); });
      row.appendChild(b);
    } else {
      [['WhatsApp', 'https://wa.me/?text=' + enc(text + ' ' + url)],
       ['X', 'https://x.com/intent/post?text=' + enc(text) + '&url=' + enc(url)],
       ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url)]].forEach(([n, href]) => {
        const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = n; row.appendChild(a);
      });
    }
    const c = document.createElement('button'); c.type = 'button'; c.textContent = L.copy;
    c.addEventListener('click', () => {
      const done = () => { c.textContent = L.copied; setTimeout(() => { c.textContent = L.copy; }, 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
      else { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* ingen */ } document.body.removeChild(ta); done(); }
    });
    row.appendChild(c);
  }

  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    $('resTitle').textContent = t('resTitle')(round.correct, N);
    $('resText').textContent = t('resText')(fmt(round.time), round.pts);
    if (!round.wrong.length) { $('resReview').innerHTML = `<p>${t('perfect')}</p>`; }
    else {
      const seen = new Set();
      const items = round.wrong.filter(q => { const k = q.type === 'fact' ? 'f' + q.f : q.a; return !seen.has(k) && seen.add(k); }).map(reviewItem).join('');
      $('resReview').innerHTML = `<p><b>${t('reviewTitle')}</b></p><ul class="review">${items}</ul>`;
    }
    showBest();
    renderShare();
    renderMore();
    $('again').focus({ preventScroll: true });
  }

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', () => { stopHighlights(); $('result').hidden = true; $('start').hidden = false; round = null; showBest(); });
  $('hide').addEventListener('change', () => { if (round && !$('play').hidden && !round.answered) { const q = round.qs[round.n]; if (q.type === 'hear' || q.type === 'fog') drawPat(A[q.a].pat); } });

  document.addEventListener('keydown', e => {
    if ($('play').hidden || !round || e.ctrlKey || e.metaKey || e.altKey) return;
    const q = round.qs[round.n];
    if (q.type === 'build') {
      if (round.answered) return;
      const k = e.key.toLowerCase();
      if (k === 'k') addBlast('s');
      else if (k === 'l') addBlast('l');
      else if (e.key === 'Backspace') { round.input = round.input.slice(0, -1); drawInput(); }
      else if (e.key === 'Enter' && round.input && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); answer(round.input); }
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !round.answered && q.opts[n - 1]) answer(q.opts[n - 1].id);
  });

  applyLang();
})();

if (typeof module !== 'undefined') module.exports = { A, FACTS, HEAR, FOG, BUILD, makeRound, schedule, patSVG, N, T };

<script id="musikk-js">
/* MUSIKK-BEGIN */
(function () {
  var d = document, root = d.documentElement, game = d.body.dataset.game || '';
  var go = d.getElementById('go'); if (!go || d.getElementById('musikk')) return;
  var KEY = game === 'lydsignaler' ? 'cphd-music-lyd' : 'cphd-music';
  var SRC = (location.pathname.replace(/[^\/]*$/, '').replace(/[^\/]+\/$/, '') || '/') + 'audio/tema.mp3';
  var V = 0.35, X = 1500;
  var T = { nb: { on: 'Musikk: på', off: 'Musikk: av', note: 'Musikk laget med KI (Google Lyria)' },
            en: { on: 'Music: on', off: 'Music: off', note: 'Music made with AI (Google Lyria)' } };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var want = store.get(KEY) === '1';           // brukerens valg (lagres)
  var playing = false, hold = false, cur = 0, timer = null, resumeT = null, started = false;
  var tracks = [new Audio(), new Audio()];
  tracks.forEach(function (a) { a.preload = 'none'; a.volume = 0; a.setAttribute('playsinline', ''); });

  var p = d.createElement('p'); p.className = 'musikk';
  p.innerHTML = '<button type="button" id="musikk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg><span></span></button><span class="muz-note"></span>';
  go.parentNode.insertBefore(p, go.nextSibling);
  var btn = p.querySelector('button'), label = btn.querySelector('span'), note = p.querySelector('.muz-note');

  function L() { return T[root.lang === 'en' ? 'en' : 'nb']; }
  function render() { label.textContent = want ? L().on : L().off; btn.setAttribute('aria-pressed', want ? 'true' : 'false'); note.textContent = L().note; }
  function fade(a, to, ms, done) {
    if (a._f) clearInterval(a._f);
    var from = a.volume, t0 = Date.now();
    a._f = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) { clearInterval(a._f); a._f = null; if (done) done(); }
    }, 50);
  }
  function begin(i) {
    var a = tracks[i]; if (!a.src) a.src = SRC;
    try { a.currentTime = 0; } catch (e) {}
    var pr = a.play(); if (pr && pr.catch) pr.catch(function () { playing = false; });
    fade(a, V, X);
  }
  function watch() {
    var a = tracks[cur];
    if (playing && a.duration && !a.paused && a.currentTime >= a.duration - X / 1000 - 0.1) {
      fade(a, 0, X, function () { a.pause(); });
      cur = 1 - cur; begin(cur);
    }
  }
  function start() {
    if (playing || hold || !want) return;
    playing = true; begin(cur);
    if (!timer) timer = setInterval(watch, 200);
  }
  function stop(ms) {
    playing = false;
    tracks.forEach(function (a) { fade(a, 0, ms == null ? 500 : ms, function () { if (!playing) a.pause(); }); });
  }
  btn.addEventListener('click', function () {
    want = !want; store.set(KEY, want ? '1' : '0'); render();
    if (want) { hold = false; start(); } else stop();
  });
  /* starter bare etter brukerklikk på Start, hvis brukeren allerede har valgt musikk */
  go.addEventListener('click', function () { if (want) start(); });
  /* signalspill: pause musikken mens lydsignalet spilles */
  d.addEventListener('cphd:sound', function (e) {
    if (!want || !playing) return;
    var sec = (e.detail && e.detail.sec) || 6;
    hold = true; stop(200);
    clearTimeout(resumeT);
    resumeT = setTimeout(function () { hold = false; if (want) start(); }, sec * 1000 + 800);
  });
  d.addEventListener('visibilitychange', function () {
    if (d.hidden) { if (playing) { stop(100); playing = false; started = true; } }
    else if (started && want) { started = false; start(); }
  });
  new MutationObserver(render).observe(root, { attributes: true, attributeFilter: ['lang'] });
  render();
})();
/* MUSIKK-END */
