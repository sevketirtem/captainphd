}

<script>
'use strict';
/* ==========================================================================
   Hvem viker? — Captain PhD
   Kilde/Source: Marfag K52 Lærebok sjøveisreglene (regel 3 (k) s. 37; regel 11–14
   s. 119–125; regel 15–18 s. 130–154; regel 19 s. 158), CC BY-SA 3.0; tilpasset/adapted.
   Faktatabell: captainphd-prosjektet, k52-manovrer-faktatabell.md
   Bare entydige situasjoner brukes. Grensetilfeller (ca. 22,5° akterlig for tvers,
   og møte i grensen) er med vilje utelatt fra poenggivende spørsmål.
   ========================================================================== */

const T = {
  nb: {
    title: 'Hvem viker?',
    lede: 'Hvem skal holde av veien, og hvem skal holde kurs og fart? Sjøveisreglene regel 11–19: møte, kryssende kurser, forbikjøring, fartøyenes innbyrdes ansvar og nedsatt sikt. 10 spørsmål.',
    chooseMode: 'Velg modus',
    mSit: 'Situasjon', mSitSub: 'Tegning ovenfra',
    mTyp: 'Fartøytype', mTypSub: 'Hvem viker for hvem?',
    mRank: 'Rangering', mRankSub: 'Regel 18',
    mVis: 'Nedsatt sikt', mVisSub: 'Regel 19',
    mRul: 'Regler', mRulSub: 'Regel 11–18',
    mMix: 'Blandet', mMixSub: 'Alt',
    note: 'Bare entydige situasjoner brukes. Grensetilfeller (rundt 22,5° akterlig for tvers og møte i grensen) er utelatt. Bare de internasjonale reglene gjelder her, ikke de norske særreglene.',
    start: 'Start', again: 'Spill igjen', next: 'Neste', finish: 'Se resultat', undo: 'Angre siste valg',
    right: 'Riktig!', wrong: 'Feil.', answerWas: 'Riktig svar:', orderWas: 'Riktig rekkefølge:',
    count: (i, n) => `Spørsmål ${i}/${n}`, score: s => `${s} poeng`,
    resTitle: (c, n) => `${c} av ${n} riktige`,
    resText: (time, pts) => `Tid: ${time}. Poeng: ${pts}.`,
    best: (pts, mode) => `Din beste poengsum (${mode}): ${pts}`,
    reviewTitle: 'Dette bør du lese en gang til:',
    perfect: 'Alt riktig. Godt sjømannskap!',
    you: 'Du', other: 'Den andre', wind: 'Vind', bow: 'baug', radarLbl: 'Radar, baugen opp', target: 'Mål',
    sceneAlt: 'Tegning av to fartøy sett ovenfra',
    radarAlt: 'Radarbilde med ett mål',
    kn: 'kn',
    disclaimer: 'Spillet er laget for læring og erstatter ikke offisiell eksamen eller opplæring.',
    source: 'Kilde: Marfag K52 Lærebok sjøveisreglene, CC BY-SA 3.0; tilpasset. Tegningene er laget for dette spillet.',
    licence: 'Spørsmål, tekster og tegninger i spillet deles under <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.no" rel="license">CC BY-SA 3.0</a>. Fant du en feil? Gi beskjed via <a href="https://github.com/sevketirtem/captainphd/issues">GitHub</a>.',
    modeName: { situasjon: 'situasjon', 'fartøy': 'fartøytype', rangering: 'rangering', sikt: 'nedsatt sikt', regler: 'regler', blandet: 'blandet' },
    langBtn: 'English'
  },
  en: {
    title: 'Who gives way?',
    lede: 'Who must keep out of the way, and who must hold course and speed? Rules 11–19 of the collision regulations: head-on, crossing, overtaking, responsibilities between vessels and restricted visibility. 10 questions.',
    chooseMode: 'Choose a mode',
    mSit: 'Situation', mSitSub: 'Drawing from above',
    mTyp: 'Vessel type', mTypSub: 'Who gives way to whom?',
    mRank: 'Ranking', mRankSub: 'Rule 18',
    mVis: 'Restricted visibility', mVisSub: 'Rule 19',
    mRul: 'Rules', mRulSub: 'Rules 11–18',
    mMix: 'Mixed', mMixSub: 'Everything',
    note: 'Only clear-cut situations are used. Borderline cases (around 22.5° abaft the beam, and borderline head-on) are left out. Only the international rules apply here, not the Norwegian special rules.',
    start: 'Start', again: 'Play again', next: 'Next', finish: 'See result', undo: 'Undo last choice',
    right: 'Correct!', wrong: 'Wrong.', answerWas: 'Correct answer:', orderWas: 'Correct order:',
    count: (i, n) => `Question ${i}/${n}`, score: s => `${s} points`,
    resTitle: (c, n) => `${c} of ${n} correct`,
    resText: (time, pts) => `Time: ${time}. Points: ${pts}.`,
    best: (pts, mode) => `Your best score (${mode}): ${pts}`,
    reviewTitle: 'Worth reading once more:',
    perfect: 'All correct. Good seamanship!',
    you: 'You', other: 'The other', wind: 'Wind', bow: 'bow', radarLbl: 'Radar, head up', target: 'Target',
    sceneAlt: 'Drawing of two vessels seen from above',
    radarAlt: 'Radar picture with one target',
    kn: 'kn',
    disclaimer: 'This game is made for learning and does not replace official examinations or training.',
    source: 'Source: Marfag K52 Lærebok sjøveisreglene, CC BY-SA 3.0; adapted. The drawings were made for this game.',
    licence: 'Questions, texts and drawings in this game are shared under <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="license">CC BY-SA 3.0</a>. Found a mistake? Tell us on <a href="https://github.com/sevketirtem/captainphd/issues">GitHub</a>.',
    modeName: { situasjon: 'situation', 'fartøy': 'vessel type', rangering: 'ranking', sikt: 'restricted visibility', regler: 'rules', blandet: 'mixed' },
    langBtn: 'Norsk'
  }
};
const N = 10;

/* ---------- Geometri ----------
   Eget fartøy ligger i origo og peker opp (kurs 0). x = styrbord, y = forover. Kurs/peiling i grader med klokken. */
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const norm = a => ((a % 360) + 360) % 360;
const near = a => Math.min(norm(a), 360 - norm(a));
function brg(from, to, heading) { return norm(deg(Math.atan2(to.x - from.x, to.y - from.y)) - heading); }
const inStern = a => a > 112.5 && a < 247.5; // akterlig for tvers med mer enn 22,5° (regel 13 b; regel 21 c: akterlanternens sektor 135° = 180° ± 67,5°)
/* Klassifiserer to maskindrevne fartøy i sikte av hverandre (regel 13, 14, 15). */
function classify(own, tgt) {
  const b = brg(own, tgt, own.h), b2 = brg(tgt, own, tgt.h);
  if (inStern(b)) return { rule: 'r13', role: 'stand', b, b2 };
  if (inStern(b2)) return { rule: 'r13', role: 'give', b, b2 };
  const dh = near(tgt.h - own.h - 180);
  if (near(b) <= 5 && near(b2) <= 5 && dh <= 5) return { rule: 'r14', role: 'both', b, b2 };
  return { rule: 'r15', role: b < 180 ? 'give' : 'stand', b, b2 };
}
/* Avstand til grensene (22,5° akterlig for tvers) — brukes for å holde tvilstilfeller utenfor spillet */
const margin = c => Math.min(Math.abs(c.b - 112.5), Math.abs(c.b - 247.5), Math.abs(c.b2 - 112.5), Math.abs(c.b2 - 247.5));

/* ---------- Situasjoner (tegning ovenfra) ---------- */
const SCN = [];
(function () {
  const OWN = (kn) => ({ x: 0, y: 0, h: 0, kn });
  // Kryssende kurser: begge peker mot samme punkt P foran eget fartøy (fare for sammenstøt)
  const P = { x: 0, y: 5 };
  [['stb', 1], ['bb', -1]].forEach(([side, s]) => {
    [30, 45, 60, 75, 85].forEach(beta => {
      [4.5, 6, 7.5].forEach(r => {
        const T0 = { x: s * r * Math.sin(rad(beta)), y: r * Math.cos(rad(beta)) };
        const q = Math.hypot(T0.x - P.x, T0.y - P.y);
        if (q < 3 || q > 8.2) return;
        const kn = Math.round(12 * q / 5);
        const sc = { kind: 'cross', side, own: OWN(12), tgt: { ...T0, h: norm(deg(Math.atan2(P.x - T0.x, P.y - T0.y))), kn }, P };
        const c = classify(sc.own, sc.tgt);
        if (c.rule === 'r15' && margin(c) >= 15 && kn >= 6 && kn <= 20) { sc.exp = { rule: c.rule, role: c.role }; SCN.push(sc); }
      });
    });
  });
  // Møte
  [-0.3, 0, 0.3].forEach(x => [-2, 0, 2].forEach(dh => {
    const sc = { kind: 'head', own: OWN(12), tgt: { x, y: 7, h: norm(180 + dh), kn: 11 + (dh === 0 ? 1 : 0) + (x > 0 ? 1 : 0) } };
    const c = classify(sc.own, sc.tgt); sc.exp = { rule: c.rule, role: c.role };
    if (c.rule === 'r14') SCN.push(sc);
  }));
  // Forbikjøring: du tar igjen / du blir tatt igjen
  [4, 5.5].forEach(y => [-0.5, 0.5].forEach(x => [0, 5, -5].forEach(h => {
    const a = { kind: 'over', own: OWN(14), tgt: { x, y, h: norm(h), kn: 9 } };
    const b = { kind: 'overt', own: OWN(9), tgt: { x, y: -y, h: norm(h), kn: 15 } };
    [a, b].forEach(sc => {
      const c = classify(sc.own, sc.tgt); sc.exp = { rule: c.rule, role: c.role };
      if (c.rule === 'r13' && margin(c) >= 15) SCN.push(sc);
    });
  })));
})();

/* ---------- Tegning (SVG) ---------- */
function shipSVG(p, own, kn, label, kt) {
  const col = own ? 'var(--sea)' : 'var(--amber)';
  return `<g transform="translate(${p.sx.toFixed(1)} ${p.sy.toFixed(1)}) rotate(${p.h.toFixed(1)})">` +
    `<path d="M0 -14 L6.5 -5 L6.5 11 L-6.5 11 L-6.5 -5 Z" fill="${col}" stroke="var(--fg)" stroke-width="${own ? 2 : 1.2}" stroke-linejoin="round"/></g>` +
    `<text x="${(p.sx + 12).toFixed(1)}" y="${(p.sy - 12).toFixed(1)}" font-size="12" font-weight="700" fill="var(--fg)">${label}</text>` +
    `<text x="${(p.sx + 12).toFixed(1)}" y="${(p.sy + 2).toFixed(1)}" font-size="11" fill="var(--muted)">${kn} ${kt}</text>`;
}
function arrowSVG(a, b, dash) {
  const ang = Math.atan2(b.sx - a.sx, -(b.sy - a.sy)), ux = Math.sin(ang), uy = -Math.cos(ang);
  const hx = b.sx, hy = b.sy, l = 8, w = 4;
  const p1 = [hx - ux * l + uy * w, hy - uy * l - ux * w], p2 = [hx - ux * l - uy * w, hy - uy * l + ux * w];
  return `<line x1="${a.sx.toFixed(1)}" y1="${a.sy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--fg)" stroke-width="1.6"${dash ? ' stroke-dasharray="5 4"' : ''} opacity=".7"/>` +
    `<polygon points="${hx.toFixed(1)},${hy.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="var(--fg)" opacity=".7"/>`;
}
/* scene: { own, tgt, P?, wind? } i eget koordinatsystem. */
function sceneSVG(sc, tx, wind) {
  const W = 340, H = 250;
  const arrLen = kn => Math.max(1.6, kn * 0.2);
  const dirv = h => ({ x: Math.sin(rad(h)), y: Math.cos(rad(h)) });
  const O = sc.own, Tg = sc.tgt;
  const endOf = s => sc.P && (sc.kind === 'cross') ? sc.P : { x: s.x + dirv(s.h).x * arrLen(s.kn), y: s.y + dirv(s.h).y * arrLen(s.kn) };
  const pts = [O, Tg, endOf(O), endOf(Tg)];
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minx = Math.min(...xs) - 1.6, maxx = Math.max(...xs) + 1.6, miny = Math.min(...ys) - 1.6, maxy = Math.max(...ys) + 1.6;
  const k = Math.min(24, (W - 90) / (maxx - minx), (H - 20) / (maxy - miny));
  const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  const S = p => ({ sx: W / 2 - 25 + (p.x - cx) * k, sy: H / 2 - (p.y - cy) * k });
  const so = { ...S(O), h: O.h }, st = { ...S(Tg), h: Tg.h };
  let g = '';
  if (sc.kind === 'cross') {
    const sp = S(sc.P);
    g += arrowSVG(so, sp, true) + arrowSVG(st, sp, true);
    g += `<g stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round"><line x1="${sp.sx - 5}" y1="${sp.sy - 5}" x2="${sp.sx + 5}" y2="${sp.sy + 5}"/><line x1="${sp.sx - 5}" y1="${sp.sy + 5}" x2="${sp.sx + 5}" y2="${sp.sy - 5}"/></g>`;
  } else {
    const eo = S(endOf(O)), et = S(endOf(Tg));
    g += arrowSVG(so, eo, true) + arrowSVG(st, et, true);
  }
  g += shipSVG(st, false, Tg.kn, tx.other, tx.kn) + shipSVG(so, true, O.kn, tx.you, tx.kn);
  if (wind != null) {
    const a = norm(wind + 180); // retningen vinden blåser mot
    const c = { x: W - 34, y: 34 }, r = 20;
    const ux = Math.sin(rad(a)), uy = -Math.cos(rad(a));
    g += `<circle cx="${c.x}" cy="${c.y}" r="${r + 6}" fill="none" stroke="var(--line)"/>` +
      arrowSVG({ sx: c.x - ux * r, sy: c.y - uy * r }, { sx: c.x + ux * r, sy: c.y + uy * r }, false) +
      `<text x="${c.x}" y="${c.y + r + 22}" text-anchor="middle" font-size="11" fill="var(--muted)">${tx.wind}</text>`;
  }
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx.sceneAlt}">${g}</svg>`;
}
function radarSVG(beta, tx) {
  const c = 110, R = [30, 60, 90];
  const x = c + 60 * Math.sin(rad(beta)), y = c - 60 * Math.cos(rad(beta));
  return `<svg class="scene" viewBox="0 0 220 220" style="max-height:250px" role="img" aria-label="${tx.radarAlt}">` +
    R.map(r => `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)"/>`).join('') +
    `<line x1="${c}" y1="${c}" x2="${c}" y2="${c - 98}" stroke="var(--muted)" stroke-dasharray="4 3"/>` +
    `<text x="${c + 4}" y="14" font-size="11" fill="var(--muted)">${tx.bow}</text>` +
    `<path d="M${c} ${c - 9} L${c + 5} ${c + 3} L${c - 5} ${c + 3} Z" fill="var(--sea)" stroke="var(--fg)"/>` +
    `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="var(--amber)" stroke="var(--fg)" stroke-width="1.4"/>` +
    `<text x="${(x + 9).toFixed(1)}" y="${(y + 4).toFixed(1)}" font-size="11" fill="var(--fg)">${tx.target}</text>` +
    `<text x="8" y="212" font-size="11" fill="var(--muted)">${tx.radarLbl}</text></svg>`;
}

/* ---------- Fartøytyper (regel 18) ---------- */
const TYPE = {
  nuc:  { a: { nb: 'et fartøy som ikke er under kommando', en: 'a vessel not under command' }, n: { nb: 'Fartøy som ikke er under kommando', en: 'Vessel not under command' }, lvl: 1 },

const FACT_R = FACTS.map((f, i) => i).filter(i => FACTS[i].g === 'rul');
const FACT_V = FACTS.map((f, i) => i).filter(i => FACTS[i].g === 'vis');
function factQuestion(i) {
  const f = FACTS[i];
  return { kind: 'mc', pool: 'f' + i, stem: f.q, opts: shuffle(f.o.map((o, j) => ({ id: 'o' + j, nb: o.nb, en: o.en }))), ok: 'o0', x: f.x, ref: f.ref };
}

/* ---------- Runde ---------- */
function typesFor(mode) {
  if (mode === 'situasjon') return Array(N).fill('sit');
  if (mode === 'fartøy') return Array(N).fill('typ');
  if (mode === 'rangering') return Array(N).fill('rank');
  if (mode === 'sikt') return shuffle(['radar', 'radar', 'radar', 'radar', 'vis', 'vis', 'vis', 'vis', 'vis', 'vis']);
  if (mode === 'regler') return Array(N).fill('rul');
  return shuffle(['sit', 'sit', 'sit', 'typ', 'typ', 'rank', 'radar', 'rul', 'rul', 'vis']);
}
function makeRound(mode) {
  const sitI = cycle(SCN.map((s, i) => i));
  const drawRule = cycle(['rule', 'role']);
  const crossI = cycle(SCN.map((s, i) => i).filter(i => SCN[i].kind === 'cross'));
  const overI = cycle(SCN.map((s, i) => i).filter(i => SCN[i].kind === 'over' || SCN[i].kind === 'overt'));
  const kindI = { pair: cycle(PAIRS), o13: cycle(OVER13), r12: cycle(R12) };
  const typKinds = cycle(['pair', 'pair', 'o13', 'r12']);
  const radarB = cycle(RADAR), fr = cycle(FACT_R), fv = cycle(FACT_V);
  const out = [], used = new Set();
  typesFor(mode).forEach(t => {
    for (let tries = 0; tries < 30; tries++) {
      let q;
      if (t === 'sit') q = sitQuestion(sitI(), drawRule());
      else if (t === 'typ') {
        const k = typKinds();
        if (k === 'pair') q = pairQuestion(kindI.pair(), SCN[crossI()]);
        else if (k === 'o13') {
          const p = kindI.o13(), cand = shuffle(overI ? SCN.map((s, i) => i).filter(i => SCN[i].kind === p.dir) : []);
          q = over13Question(p, SCN[cand[0]]);
        } else q = r12Question(kindI.r12());
      } else if (t === 'rank') q = rankQuestion();
      else if (t === 'radar') q = radarQuestion(radarB());
      else if (t === 'rul') q = factQuestion(fr());
      else q = factQuestion(fv());
      // Samme tema ikke to ganger i en runde, og pool-nøkkelen unik
      const key = q.pool.replace(/(rule|role)$/, '');
      if (!used.has(key) || tries === 29) { used.add(key); out.push(q); break; }
    }
  });
  return out;
}

/* ---------- Spill ---------- */
if (typeof document !== 'undefined') (function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ingen lagring */ } }
  };
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : (params.get('lang') === 'nb' ? 'nb' : (store.get('cphd-lang') || 'nb'));
  let mode = 'situasjon';
  let round = null, timer = null;
  const t = k => T[lang][k];

  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'nb';
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
    document.title = `${t('title')} · Captain PhD`;
    $('lang').textContent = t('langBtn');
    const home = document.querySelector('.home'); home.href = lang === 'en' ? home.dataset.hrefEn : home.dataset.hrefNb;
    showBest();
    if (round && !$('play').hidden) renderQ(true);
    if (round && !$('result').hidden) showResult();
  }
  $('lang').addEventListener('click', () => { lang = lang === 'nb' ? 'en' : 'nb'; store.set('cphd-lang', lang); applyLang(); });
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    showBest();
  }));
  function showBest() {
    const b = store.get('cphd-hvemviker-best-' + mode);
    $('best').textContent = b ? t('best')(b, T[lang].modeName[mode]) : '';
  }
  const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

  function start() {
    round = { qs: makeRound(mode), n: 0, correct: 0, pts: 0, t0: Date.now(), wrong: [], answered: false, picks: [] };
    $('start').hidden = true; $('result').hidden = true; $('play').hidden = false;
    clearInterval(timer);
    timer = setInterval(() => { $('clock').textContent = fmt(Date.now() - round.t0); }, 500);
    renderQ();
  }

  function sceneFor(q) {
    if (!q.scene) return '';
    const tx = { you: t('you'), other: t('other'), wind: t('wind'), kn: t('kn'), sceneAlt: t('sceneAlt'), bow: t('bow'), radarLbl: t('radarLbl'), target: t('target'), radarAlt: t('radarAlt') };
    if (q.scene.radar != null) return radarSVG(q.scene.radar, tx);
    return sceneSVG(q.scene.sc, tx, q.scene.wind);
  }

  function renderQ(keepState) {
    const q = round.qs[round.n];
    $('count').textContent = t('count')(round.n + 1, N);
    $('score').textContent = t('score')(round.pts);
    $('sceneBox').innerHTML = sceneFor(q);
    $('cap').hidden = true;
    $('question').textContent = q.stem[lang];
    const box = $('opts'); box.innerHTML = '';
    $('undo').hidden = q.kind !== 'rank';
    if (q.kind === 'rank') {
      q.items.forEach((o, idx) => {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.a = o.id;
        b.innerHTML = `<kbd>${idx + 1}</kbd><span>${o[lang]}</span><span class="ord"></span>`;
        b.addEventListener('click', () => tapRank(o.id));
        box.appendChild(b);
      });
      paintRank();
    } else {
      q.opts.forEach((o, idx) => {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.a = o.id;
        b.innerHTML = `<kbd>${idx + 1}</kbd><span>${o[lang]}</span>`;
        b.addEventListener('click', () => answer(o.id));
        box.appendChild(b);
      });
    }
    if (keepState && round.answered) { markAnswer(round.lastPick); return; }
    if (!keepState) { round.answered = false; round.qStart = Date.now(); round.picks = []; paintRank(); }
    $('explain').hidden = true; $('next').hidden = true;
    const first = box.querySelector('button'); if (first && !keepState) first.focus({ preventScroll: true });
  }

  function paintRank() {
    const q = round.qs[round.n]; if (!q || q.kind !== 'rank') return;
    document.querySelectorAll('#opts button').forEach(b => {
      const i = round.picks.indexOf(b.dataset.a);
      b.classList.toggle('picked', i >= 0);
      b.querySelector('.ord').textContent = i >= 0 ? String(i + 1) : '';
      if (!round.answered) b.disabled = i >= 0;
    });
    $('undo').disabled = round.answered || !round.picks.length;
  }
  function tapRank(id) {
    if (round.answered || round.picks.includes(id)) return;
    round.picks.push(id); paintRank();
    const q = round.qs[round.n];
    if (round.picks.length === q.order.length) answer(round.picks.join('>'));
  }
  $('undo').addEventListener('click', () => { if (!round.answered) { round.picks.pop(); paintRank(); } });

  function isRight(q, a) { return q.kind === 'rank' ? a === q.order.join('>') : a === q.ok; }
  function answer(a) {
    if (round.answered) return;
    round.answered = true; round.lastPick = a;
    const q = round.qs[round.n];
    if (isRight(q, a)) {
      round.correct++;
      const secs = (Date.now() - round.qStart) / 1000;
      round.pts += 100 + Math.max(0, Math.round(50 - secs * (q.kind === 'rank' ? 3 : 5)));
    } else round.wrong.push(q);
    markAnswer(a);
  }

  function markAnswer(a) {
    const q = round.qs[round.n], ok = isRight(q, a);
    let head = '';
    if (q.kind === 'rank') {
      const names = q.order.map(id => TYPE[id].n[lang]).join(' → ');
      round.picks = a.split('>');
      document.querySelectorAll('#opts button').forEach(b => { b.disabled = true; b.classList.remove('picked'); b.classList.add(q.order.indexOf(b.dataset.a) === round.picks.indexOf(b.dataset.a) ? 'right' : 'wrong'); b.querySelector('.ord').textContent = String(round.picks.indexOf(b.dataset.a) + 1); });
      head = ok ? '' : `${t('orderWas')} <b>${names}</b>. `;
      $('undo').disabled = true;
    } else {
      document.querySelectorAll('#opts button').forEach(b => {
        b.disabled = true;
        if (b.dataset.a === q.ok) b.classList.add('right'); else if (b.dataset.a === a) b.classList.add('wrong');
      });
      const right = q.opts.find(o => o.id === q.ok);
      head = ok ? '' : `${t('answerWas')} <b>${right[lang]}</b>. `;
    }
    $('explain').innerHTML = `<b class="${ok ? 'ok' : 'bad'}">${ok ? t('right') : t('wrong')}</b> ${head}${q.x[lang]} <span style="color:var(--muted)">(${q.ref})</span>`;
    $('explain').hidden = false;
    $('score').textContent = t('score')(round.pts);
    $('next').textContent = round.n === N - 1 ? t('finish') : t('next');
    $('next').hidden = false; $('next').focus({ preventScroll: true });
  }

  $('next').addEventListener('click', () => {
    if (round.n === N - 1) { finish(); return; }
    round.n++; renderQ();
    $('play').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });

  function finish() {
    clearInterval(timer);
    round.time = Date.now() - round.t0;
    const key = 'cphd-hvemviker-best-' + mode, best = +(store.get(key) || 0);
    if (round.pts > best) store.set(key, String(round.pts));
    showResult();
  }
  function showResult() {
    $('play').hidden = true; $('result').hidden = false;
    $('resTitle').textContent = t('resTitle')(round.correct, N);
    $('resText').textContent = t('resText')(fmt(round.time), round.pts);
    if (!round.wrong.length) { $('resReview').innerHTML = `<p>${t('perfect')}</p>`; }
    else {
      const seen = new Set();
      const items = round.wrong.filter(q => { const k = q.ref + q.x.nb; return !seen.has(k) && seen.add(k); })
        .map(q => `<li><b>${q.stem[lang].length > 150 ? q.stem[lang].slice(0, 147) + '…' : q.stem[lang]}</b> ${q.x[lang]} <span style="color:var(--muted)">(${q.ref})</span></li>`).join('');
      $('resReview').innerHTML = `<p><b>${t('reviewTitle')}</b></p><ul class="review">${items}</ul>`;
    }
    showBest();
    $('again').focus({ preventScroll: true });
  }

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', () => { $('result').hidden = true; $('start').hidden = false; round = null; showBest(); });

  document.addEventListener('keydown', e => {
    if ($('play').hidden || !round || e.ctrlKey || e.metaKey || e.altKey) return;
    const q = round.qs[round.n];
    if (q.kind === 'rank') {
      if (e.key === 'Backspace' && !round.answered) { round.picks.pop(); paintRank(); return; }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= q.items.length) tapRank(q.items[n - 1].id);
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !round.answered && q.opts[n - 1]) answer(q.opts[n - 1].id);
  });

  applyLang();
})();

if (typeof module !== 'undefined') module.exports = { SCN, PAIRS, OVER13, R12, FACTS, RADAR, TYPE, R18, makeRound, classify, brg, margin, gives, sceneSVG, radarSVG, windInfo, N, T };
</script>
